<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Тест гри</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    color:white;
    font-family:Arial;
}

button{
    padding:20px 40px;
    font-size:22px;
    border:0;
    border-radius:15px;
    background:red;
    color:white;
}
</style>
</head>

<body>

<button id="start">ПОЧАТИ ГРУ</button>

<script>
document.getElementById("start").addEventListener("click", function(){

    document.body.innerHTML = `
        <div style="
            width:100%;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#182519;
            color:white;
            font-family:Arial;
            font-size:35px;
        ">
            🧟 ГРА ЗАПУСТИЛАСЯ!
        </div>
    `;

});
</script>

</body>
</html>
