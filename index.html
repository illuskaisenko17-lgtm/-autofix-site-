<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Top 3D Car Garage</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0a; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* Панель тюнінгу */
        .tuning-panel { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }
        .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
        
        /* Сенсорні кнопки переміщення */
        .controls { position: absolute; bottom: 20px; left: 20px; display: grid; grid-template-columns: repeat(3, 55px); gap: 8px; z-index: 10; }
        .btn { width: 55px; height: 55px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.5); color: #fff; font-size: 20px; font-weight: bold; border-radius: 50%; display: flex; align-items: center; justify-content: center; user-select: none; }
        .btn:active { background: rgba(255,153,0,0.8); border-color: #ff9900; }
        #btn-up { grid-column: 2; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        
        #hint { position: absolute; bottom: 25px; right: 20px; color: rgba(255,255,255,0.6); font-size: 12px; pointer-events: none; text-align: right; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Меню вибору кольору -->
    <div class="tuning-panel">
        <div class="color-btn" style="background: #e60000;" onclick="setCarColor(0xe60000)"></div>
        <div class="color-btn" style="background: #0066ff;" onclick="setCarColor(0x0066ff)"></div>
        <div class="color-btn" style="background: #111111;" onclick="setCarColor(0x111111)"></div>
        <div class="color-btn" style="background: #00cc44;" onclick="setCarColor(0x00cc44)"></div>
        <div class="color-btn" style="background: #ffcc00;" onclick="setCarColor(0xffcc00)"></div>
    </div>

    <!-- Джойстик ходьби -->
    <div class="controls">
        <div class="btn" id="btn-up">▲</div>
        <div class="btn" id="btn-left">◄</div>
        <div class="btn" id="btn-down">▼</div>
        <div class="btn" id="btn-right">►</div>
    </div>

    <div id="hint">Права частина екрана — огляд 🔄</div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0d0d);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Освітлення гаража
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xffaa00, 2);
        spotLight.position.set(0, 8, 0);
        scene.add(spotLight);

        // Підлога з сіткою
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4, metalness: 0.2 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const grid = new THREE.GridHelper(24, 24, 0xff9900, 0x333333);
        grid.position.y = 0.01;
        scene.add(grid);

        // --- ДЕТАЛІЗОВАНА МОДЕЛЬ АВТО ---
        const carGroup = new THREE.Group();
        const carMat = new THREE.MeshStandardMaterial({ color: 0xe60000, metalness: 0.8, roughness: 0.2 });

        // Основний кузов
        const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.65, 4.4), carMat);
        body.position.y = 0.55;
        carGroup.add(body);

        // Кабіна та лобове скло
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.55, 2.1), glassMat);
        cabin.position.set(0, 1.1, -0.2);
        carGroup.add(cabin);

        // Фари
        const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffcc });
        const hl1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.1), headlightMat);
        hl1.position.set(-0.7, 0.6, 2.2);
        const hl2 = hl1.clone();
        hl2.position.x = 0.7;
        carGroup.add(hl1);
        carGroup.add(hl2);

        // Спойлер
        const spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.1, 0.4), carMat);
        spoiler.position.set(0, 1.1, -2.0);
        carGroup.add(spoiler);

        // Колеса
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.35, 24);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9 });

        const wheelPositions = [[-1.15, 0.4, 1.2], [1.15, 0.4, 1.2], [-1.15, 0.4, -1.2], [1.15, 0.4, -1.2]];
        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            
            const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.36, 12), rimMat);
            rim.rotation.z = Math.PI / 2;
            wheel.add(rim);

            wheel.position.set(...pos);
            carGroup.add(wheel);
        });

        scene.add(carGroup);
        camera.position.set(0, 1.6, 5);

        // Функція зміни кольору авто
        function setCarColor(hex) {
            carMat.color.setHex(hex);
            spoiler.material.color.setHex(hex);
        }

        // Керування кнопками
        let moveState = { up: false, down: false, left: false, right: false };
        const bindBtn = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); moveState[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); moveState[key] = false; });
        };
        bindBtn('btn-up', 'up');
        bindBtn('btn-down', 'down');
        bindBtn('btn-left', 'left');
        bindBtn('btn-right', 'right');

        // Огляд пальцем (Обертання камери)
        let touchX = 0, touchY = 0;
        let lon = 0, lat = 0;

        document.addEventListener('touchstart', (e) => {
            if(e.touches[0].clientX > window.innerWidth / 2) {
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            }
        });

        document.addEventListener('touchmove', (e) => {
            for(let i=0; i<e.touches.length; i++) {
                if(e.touches[i].clientX > window.innerWidth / 3) {
                    let movementX = e.touches[i].clientX - touchX;
                    let movementY = e.touches[i].clientY - touchY;
                    touchX = e.touches[i].clientX;
                    touchY = e.touches[i].clientY;

                    lon -= movementX * 0.25;
                    lat -= movementY * 0.25;
                    lat = Math.max(-85, Math.min(85, lat));
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Цикл рендеру
        function animate() {
            requestAnimationFrame(animate);

            let phi = THREE.MathUtils.degToRad(90 - lat);
            let theta = THREE.MathUtils.degToRad(lon);

            let target = new THREE.Vector3();
            target.x = camera.position.x + Math.sin(phi) * Math.cos(theta);
            target.y = camera.position.y + Math.cos(phi);
            target.z = camera.position.z + Math.sin(phi) * Math.sin(theta);
            camera.lookAt(target);

            const speed = 0.07;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0; dir.normalize();

            const sideDir = new THREE.Vector3(-dir.z, 0, dir.x);

            if (moveState.up) camera.position.addScaledVector(dir, speed);
            if (moveState.down) camera.position.addScaledVector(dir, -speed);
            if (moveState.left) camera.position.addScaledVector(sideDir, -speed);
            if (moveState.right) camera.position.addScaledVector(sideDir, speed);

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
