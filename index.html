<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GidHot — Transport</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --bg:#05060b;
 --card:#0e1320;
 --card2:#151b2a;
 --pink:#ff176b;
 --cyan:#00e5ff;
 --green:#00ff9d;
 --orange:#ff6b00;
 --white:#fff;
 --muted:#8b94a8;
}

body{
 font-family:Arial,sans-serif;
 color:white;
 background:
 radial-gradient(circle at 10% 0%,#ff176b25,transparent 30%),
 radial-gradient(circle at 90% 20%,#00e5ff15,transparent 30%),
 #05060b;
 min-height:100vh;
}

header{
 position:sticky;
 top:0;
 z-index:100;
 background:#05060bea;
 backdrop-filter:blur(15px);
 border-bottom:1px solid #ff176b55;
}

.nav{
 max-width:1450px;
 width:94%;
 margin:auto;
 height:75px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 font-size:34px;
 font-weight:1000;
}

.logo span{
 color:var(--pink);
 text-shadow:0 0 10px var(--pink),0 0 35px var(--pink);
}

.nav button{
 background:#101521;
 border:1px solid #ff176b66;
 color:white;
 padding:12px 18px;
 border-radius:12px;
 cursor:pointer;
}

.container{
 width:94%;
 max-width:1450px;
 margin:auto;
}

.hero{
 text-align:center;
 padding:65px 10px 35px;
}

.hero h1{
 font-size:clamp(45px,8vw,85px);
 font-weight:1000;
}

.hero h1 span{
 color:var(--pink);
 text-shadow:0 0 8px var(--pink),0 0 30px var(--pink);
}

.hero p{
 max-width:750px;
 margin:20px auto;
 color:var(--muted);
 line-height:1.6;
}

.search{
 max-width:700px;
 margin:25px auto;
 display:flex;
 overflow:hidden;
 border:1px solid #ff176b66;
 border-radius:16px;
 background:#0d111b;
 box-shadow:0 0 25px #ff176b18;
}

.search input{
 flex:1;
 padding:18px;
 background:transparent;
 color:white;
 border:0;
 outline:0;
 font-size:16px;
}

.search button{
 width:60px;
 border:0;
 background:var(--pink);
 color:white;
 font-size:20px;
}

.categories{
 display:flex;
 gap:10px;
 overflow-x:auto;
 padding:10px 0 30px;
}

.category{
 white-space:nowrap;
 padding:13px 20px;
 border-radius:13px;
 border:1px solid #ff176b55;
 background:#101521;
 color:white;
 cursor:pointer;
}

.category.active,
.category:hover{
 background:var(--pink);
 box-shadow:0 0 25px #ff176b55;
}

.title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:15px 0 20px;
}

.title h2{
 font-size:30px;
}

.count{
 color:var(--muted);
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
 gap:25px;
}

.card{
 overflow:hidden;
 border-radius:24px;
 background:linear-gradient(145deg,#121827,#080b12);
 border:1px solid #ff176b35;
 transition:.3s;
}

.card:hover{
 transform:translateY(-7px);
 border-color:var(--pink);
 box-shadow:0 0 25px #ff176b55,0 0 70px #ff176b15;
}

.photo{
 height:235px;
 position:relative;
 overflow:hidden;
 background:#080b11;
}

.photo img{
 width:100%;
 height:100%;
 object-fit:cover;
 transition:.5s;
}

.card:hover .photo img{
 transform:scale(1.07);
}

.badge{
 position:absolute;
 top:14px;
 left:14px;
 padding:8px 12px;
 background:#05060ddd;
 border:1px solid #ffffff22;
 border-radius:10px;
}

.like{
 position:absolute;
 top:14px;
 right:14px;
 width:43px;
 height:43px;
 border-radius:50%;
 border:1px solid #ffffff30;
 background:#05060ddd;
 color:white;
 cursor:pointer;
 font-size:19px;
}

.like.active{
 color:var(--pink);
 border-color:var(--pink);
 box-shadow:0 0 20px #ff176b;
}

.content{
 padding:20px;
}

.brand{
 color:#ff4d91;
 font-size:12px;
 letter-spacing:2px;
 font-weight:bold;
}

.content h3{
 font-size:25px;
 margin:7px 0 17px;
}

.specs{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}

.spec{
 background:var(--card2);
 padding:12px;
 border-radius:11px;
}

.spec small{
 display:block;
 color:var(--muted);
 margin-bottom:6px;
}

.spec strong{
 font-size:14px;
}

.bottom{
 margin-top:18px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.price{
 font-size:19px;
 font-weight:bold;
}

.details{
 border:0;
 padding:12px 16px;
 border-radius:12px;
 color:white;
 background:linear-gradient(90deg,var(--pink),var(--orange));
 cursor:pointer;
 font-weight:bold;
}

.compare{
 margin-top:80px;
 padding:30px;
 border-radius:25px;
 border:1px solid #ff176b55;
 background:#0b0f18;
 box-shadow:0 0 50px #ff176b15;
}

.compare h2{
 text-align:center;
 font-size:35px;
}

.compare p{
 text-align:center;
 color:var(--muted);
 margin:10px 0 25px;
}

.selects{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px;
}

select{
 width:100%;
 padding:16px;
 background:#151b29;
 color:white;
 border:1px solid #ff176b55;
 border-radius:12px;
}

.compare-btn{
 width:100%;
 padding:17px;
 margin-top:17px;
 border:0;
 border-radius:14px;
 color:white;
 background:linear-gradient(90deg,var(--pink),var(--orange));
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

.table-wrap{
 overflow-x:auto;
 margin-top:25px;
}

table{
 width:100%;
 min-width:700px;
 border-collapse:collapse;
}

th,td{
 padding:15px;
 border-bottom:1px solid #ff176b25;
 text-align:center;
}

th{
 color:#ff4d91;
}

td:first-child{
 text-align:left;
 color:var(--muted);
}

.better{
 color:var(--green);
 font-weight:bold;
 text-shadow:0 0 10px #00ff9d66;
}

.winner{
 margin-top:25px;
 padding:25px;
 border-radius:18px;
 text-align:center;
 border:1px solid var(--pink);
 background:#ff176b12;
 box-shadow:0 0 35px #ff176b25;
}

.winner h3{
 color:#ffd84d;
 font-size:27px;
}

.winner p{
 color:var(--muted);
}

.modal{
 position:fixed;
 inset:0;
 z-index:500;
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:#000d;
 backdrop-filter:blur(15px);
}

.modal.show{
 display:flex;
}

.modal-box{
 width:100%;
 max-width:900px;
 max-height:92vh;
 overflow:auto;
 border-radius:25px;
 background:#090d16;
 border:1px solid var(--pink);
 box-shadow:0 0 50px #ff176b66;
 position:relative;
}

.close{
 position:absolute;
 right:15px;
 top:15px;
 z-index:5;
 width:43px;
 height:43px;
 border-radius:50%;
 background:#000c;
 color:white;
 border:1px solid #ffffff33;
 cursor:pointer;
 font-size:18px;
}

.modal-img{
 width:100%;
 height:350px;
 object-fit:cover;
}

.modal-content{
 padding:28px;
}

.modal-content h2{
 font-size:38px;
 margin:8px 0 25px;
}

.details-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}

.detail{
 padding:16px;
 border-radius:13px;
 background:#151b29;
}

.detail span{
 display:block;
 color:var(--muted);
 font-size:13px;
 margin-bottom:7px;
}

footer{
 margin-top:80px;
 padding:40px;
 text-align:center;
 color:#667084;
 border-top:1px solid #ff176b22;
}

@media(max-width:700px){

 .nav{height:65px}

 .logo{font-size:27px}

 .hero{padding-top:40px}

 .grid{grid-template-columns:1fr}

 .selects{grid-template-columns:1fr}

 .compare{padding:20px 12px}

 .details-grid{grid-template-columns:1fr}

 .modal-img{height:230px}

 .modal-content h2{font-size:29px}
}

</style>
</head>

</main>


<footer>
<b>GidHot.</b><br><br>
Автомобілі • Мотоцикли • Пітбайки • Скутери

<div class="modal" id="modal">

<div class="modal-box">

<button class="close" onclick="closeModal()">✕</button>

<div id="modalContent"></div>

let current="all";
let favorites=[];


/* SCORE */

function score(v){

 let power=Math.min(v.power/6.2,100);
 let speed=Math.min(v.speed/3.31,100);
 let weight=Math.max(0,100-v.weight/20);
 let price=Math.max(0,100-v.price/2500);

 return Math.round(
  power*.35+
  speed*.30+
  weight*.15+
  price*.20
 );
}


/* ICON */

function icon(type){

 if(type==="Авто")return"🚗";
 if(type==="Мотоцикл")return"🏍️";
 if(type==="Пітбайк")return"🏁";
 if(type==="Скутер")return"🛵";

 return"🔥";
}


/* RENDER */

function render(){

 const search=document
 .getElementById("search")
 .value
 .toLowerCase();

 const list=vehicles.filter(v=>{

  const category=
   current==="all"||v.type===current;

  const text=
   v.name.toLowerCase().includes(search)||
   v.brand.toLowerCase().includes(search)||
   v.type.toLowerCase().includes(search);

  return category&&text;

 });

 document.getElementById("count").textContent=
 list.length+" моделей";

 document.getElementById("catalog").innerHTML=
 list.length?

 list.map(v=>`

 <article class="card">

 <div class="photo">

 <img src="${v.image}" alt="${v.name}">

 <div class="badge">
 ${icon(v.type)} ${v.type}
 </div>

 <button
 class="like ${favorites.includes(v.id)?"active":""}"
 onclick="favorite(${v.id})">
 ♥
 </button>

 </div>

 <div class="content">

 <div class="brand">
 ${v.brand.toUpperCase()}
 </div>

 <h3>${v.name}</h3>

 <div class="specs">

 <div class="spec">
 <small>⚡ Потужність</small>
 <strong>${v.power} к.с.</strong>
 </div>

 <div class="spec">
 <small>🚀 Швидкість</small>
 <strong>${v.speed} км/год</strong>
 </div>

 <div class="spec">
 <small>🔧 Двигун</small>
 <strong>${v.engine}</strong>
 </div>

 <div class="spec">
 <small>🔩 Об'єм</small>
 <strong>${v.volume}</strong>
 </div>

 <div class="spec">
 <small>⚖️ Вага</small>
 <strong>${v.weight} кг</strong>
 </div>

 <div class="spec">
 <small>🏆 Score</small>
 <strong>${score(v)}/100</strong>
 </div>

 </div>

 <div class="bottom">

 <div class="price">
 $${v.price.toLocaleString()}
 </div>

 <button
 class="details"
 onclick="details(${v.id})">
 Детальніше
 </button>

 </div>

 </div>

 </article>

 `).join("")

 :

 `<div style="grid-column:1/-1;text-align:center;padding:60px;color:#8b94a8">
 😕 Нічого не знайдено
 </div>`;

}


/* FILTER */

function filter(type,button){

 current=type;

 document
 .querySelectorAll(".category")
 .forEach(x=>x.classList.remove("active"));

 button.classList.add("active");

 render();

}


/* FAVORITE */

function favorite(id){

 if(favorites.includes(id)){
  favorites=favorites.filter(x=>x!==id);
 }else{
  favorites.push(id);
 }

 render();

}

 </div>

 <div class="detail">
 <span>💨 Розгін 0–100</span>
 <strong>${v.acc}</strong>
 </div>

 <div class="detail">
 <span>🛢️ Витрата</span>
 <strong>${v.cons}</strong>
 </div>

 <div class="detail">
 <span>📅 Рік</span>
 <strong>${v.year}</strong>
 </div>

 <div class="detail">
 <span>💰 Ціна</span>
 <strong>$${v.price.toLocaleString()}</strong>
 </div>

 <div class="detail">
 <span>🏆 GidHot Score</span>
 <strong>${score(v)}/100</strong>
 </div>

 </div>

 </div>
 `;

 document.getElementById("modal").classList.add("show");

}


function closeModal(){
 document.getElementById("modal").classList.remove("show");
}


document.getElementById("modal").onclick=e=>{
 if(e.target.id==="modal")closeModal();
};


/* SELECTS */

function fillSelects(){

 const a=document.getElementById("one");
 const b=document.getElementById("two");

 vehicles.forEach(v=>{

  a.innerHTML+=`
   <option value="${v.id}">
    ${icon(v.type)} ${v.name}
   </option>`;

  b.innerHTML+=`
   <option value="${v.id}">
    ${icon(v.type)} ${v.name}
   </option>`;

 });

 a.value=1;
 b.value=5;
}


/* COMPARE */

function compare(){

 const a=vehicles.find(
  v=>v.id==document.getElementById("one").value
 );

 const b=vehicles.find(
  v=>v.id==document.getElementById("two").value
 );

 const rows=[

 {
  name:"Потужність",
  a:a.power+" к.с.",
  b:b.power+" к.с.",
  win:a.power>b.power?"a":b.power>a.power?"b":"tie"
 },

 {
  name:"Максимальна швидкість",
  a:a.speed+" км/год",
  b:b.speed+" км/год",
  win:a.speed>b.speed?"a":b.speed>a.speed?"b":"tie"
 },

 {
  name:"Вага",
  a:a.weight+" кг",
  b:b.weight+" кг",
  win:a.weight<b.weight?"a":b.weight<a.weight?"b":"tie"
 },

 {
  name:"Ціна",
  a:"$"+a.price.toLocaleString(),
  b:"$"+b.price.toLocaleString(),
  win:a.price<b.price?"a":b.price<a.price?"b":"tie"
 },

 {
  name:"GidHot Score",
  a:score(a)+"/100",
  b:score(b)+"/100",
  win:score(a)>score(b)?"a":score(b)>score(a)?"b":"tie"
 }

 ];

 let ap=0;
 let bp=0;

 rows.forEach(r=>{
  if(r.win==="a")ap++;
  if(r.win==="b")bp++;
 });

 let winner;

 if(ap>bp){
  winner=`🏆 ${a.name}`;
 }else if(bp>ap){
  winner=`🏆 ${b.name}`;
 }else{
  winner="🤝 Нічия";
 }

 document.getElementById("result").innerHTML=`

 <div class="table-wrap">

 <table>

 <tr>
  <th>Характеристика</th>
  <th>${a.name}</th>
  <th>${b.name}</th>
 </tr>

 ${rows.map(r=>`

 <tr>

 <td>${r.name}</td>

 <td class="${r.win==="a"?"better":""}">
 ${r.a} ${r.win==="a"?"🏆":""}
 </td>

 <td class="${r.win==="b"?"better":""}">
 ${r.b} ${r.win==="b"?"🏆":""}
 </td>

 </tr>

 `).join("")}

 <tr>
  <td>Двигун</td>
  <td>${a.engine}</td>
  <td>${b.engine}</td>
 </tr>

 <tr>
  <td>Об'єм</td>
  <td>${a.volume}</td>
  <td>${b.volume}</td>
 </tr>

 <tr>
  <td>Коробка</td>
  <td>${a.gear}</td>
  <td>${b.gear}</td>
 </tr>

 <tr>
  <td>Привід</td>
  <td>${a.drive}</td>
  <td>${b.drive}</td>
 </tr>

 <tr>
  <td>Розгін</td>
  <td>${a.acc}</td>
  <td>${b.acc}</td>
 </tr>

 <tr>
  <td>Витрата</td>
  <td>${a.cons}</td>
  <td>${b.cons}</td>
 </tr>

 </table>

 </div>

 <div class="winner">

 <h3>${winner}</h3>

 <p>
 Результат за кількістю кращих показників:
 ${ap} : ${bp}
 </p>

 </div>

 `;

}


render();
fillSelects();

</script>

</body>
</html>
