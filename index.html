<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Car Repair Center</title>

<style>
:root{
  --bg:#071017;
  --panel:rgba(9,16,22,.92);
  --line:#32444f;
  --cyan:#3bdcff;
  --blue:#0a8fd0;
  --green:#48e39e;
  --yellow:#ffd84a;
  --orange:#ff9c21;
  --red:#ff4c5f;
  --white:#f7fbff;
  --muted:#9caeb9;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#02070a;
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

button{
  border:0;
  color:white;
  font-family:inherit;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 28%,rgba(42,105,127,.22),transparent 28%),
    linear-gradient(#071018,#0a151c 60%,#05090d);
}

/* -------------------------------------------------------
   GARAGE
------------------------------------------------------- */

.garage-bg{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.wall{
  position:absolute;
  inset:0 0 34% 0;
  background:
    linear-gradient(90deg,
      rgba(255,255,255,.03) 1px,
      transparent 1px),
    linear-gradient(
      rgba(255,255,255,.025) 1px,
      transparent 1px),
    linear-gradient(#0a151d,#081119);
  background-size:72px 72px,72px 72px,100% 100%;
}

.wall-lines{
  position:absolute;
  top:14%;
  left:0;
  right:0;
  height:8px;
  background:
    linear-gradient(90deg,
      transparent 0 6%,
      #5defff 6% 26%,
      transparent 26% 33%,
      #5defff 33% 53%,
      transparent 53% 62%,
      #5defff 62% 85%,
      transparent 85%);
  box-shadow:
    0 0 12px #5defff,
    0 0 30px #21b9e8;
  opacity:.8;
}

.panel-wall{
  position:absolute;
  left:5%;
  right:5%;
  top:24%;
  height:40%;
  border:2px solid #263c48;
  background:
    linear-gradient(90deg,rgba(20,34,42,.88),rgba(2,7,11,.92),rgba(20,34,42,.88));
  box-shadow:inset 0 0 70px #000;
}

.work-lights{
  position:absolute;
  top:8%;
  left:4%;
  right:4%;
  display:flex;
  justify-content:space-between;
}

.work-light{
  width:16%;
  height:4px;
  border-radius:20px;
  background:#c9fbff;
  box-shadow:0 0 8px #bdfaff,0 0 22px #25dcff;
}

.floor{
  position:absolute;
  left:-15%;
  right:-15%;
  bottom:-10%;
  height:52%;
  transform:perspective(700px) rotateX(61deg);
  transform-origin:bottom;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 8%,
      rgba(127,150,160,.12) 8.2% 8.5%),
    repeating-linear-gradient(
      0deg,
      transparent 0 13%,
      rgba(127,150,160,.10) 13.2% 13.6%),
    linear-gradient(#0d181e,#03080c);
}

.tool-cabinet{
  position:absolute;
  left:3%;
  bottom:25%;
  width:14%;
  height:31%;
  min-width:70px;
  background:linear-gradient(#182931,#0d171d);
  border:2px solid #253b46;
}

.tool-cabinet div{
  height:19%;
  margin:5%;
  background:#233640;
  border:1px solid #314b57;
}

/* -------------------------------------------------------
   HUD
------------------------------------------------------- */

.top-ui{
  position:absolute;
  z-index:50;
  top:14px;
  left:14px;
  right:14px;
  display:flex;
  gap:10px;
  align-items:stretch;
}

.logo-box{
  flex:1;
  min-width:0;
  padding:12px 15px;
  border:1px solid rgba(104,193,220,.25);
  border-radius:20px;
  background:rgba(8,16,23,.91);
  backdrop-filter:blur(12px);
}

.logo-title{
  font-size:clamp(15px,4vw,22px);
  font-weight:900;
}

.logo-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.money-box{
  min-width:112px;
  padding:0 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,216,74,.2);
  border-radius:20px;
  background:rgba(8,14,18,.95);
  font-size:17px;
  font-weight:900;
  white-space:nowrap;
}

.money-box span{
  color:var(--yellow);
}

.quest{
  position:absolute;
  z-index:48;
  top:95px;
  left:14px;
  right:14px;
  padding:14px;
  border-radius:20px;
  border:1px solid rgba(96,139,158,.28);
  background:rgba(5,11,16,.88);
  backdrop-filter:blur(12px);
}

.quest-title{
  font-size:23px;
  font-weight:900;
  margin-bottom:6px;
}

.quest-text{
  color:#aab9c4;
  font-size:13px;
  line-height:1.35;
}

.quest-progress{
  margin-top:10px;
  height:6px;
  overflow:hidden;
  border-radius:10px;
  background:#172630;
}

.quest-progress div{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#28d6ff,#8ef7ff);
  box-shadow:0 0 14px #28d6ff;
  transition:.25s;
}

/* -------------------------------------------------------
   3D GAME WORLD
------------------------------------------------------- */

.world{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.game-camera{
  position:absolute;
  inset:0;
  transform-origin:center center;
  transition:transform .15s linear;
}

.car-shadow{
  position:absolute;
  z-index:3;
  left:50%;
  bottom:24%;
  width:60%;
  height:9%;
  transform:translateX(-50%);
  border-radius:50%;
  background:rgba(0,0,0,.65);
  filter:blur(14px);
}

.car{
  position:absolute;
  z-index:10;
  left:50%;
  top:52%;
  width:min(86vw,620px);
  height:min(40vw,300px);
  max-height:330px;
  transform:translate(-50%,-50%);
  transition:.35s;
  filter:drop-shadow(0 25px 24px rgba(0,0,0,.65));
}

.car.lifted{
  transform:translate(-50%,-62%) scale(.92);
}

.car.hit{
  animation:shake .16s 2;
}

@keyframes shake{
  0%,100%{transform:translate(-50%,-50%)}
  25%{transform:translate(calc(-50% - 6px),-50%)}
  75%{transform:translate(calc(-50% + 6px),-50%)}
}

.car-svg{
  width:100%;
  height:100%;
}

.hotspot{
  position:absolute;
  z-index:20;
  width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(7,25,33,.88);
  border:2px solid var(--cyan);
  color:white;
  box-shadow:0 0 18px rgba(49,220,255,.35);
  font-size:21px;
  animation:bob 1.2s infinite ease-in-out;
}

.hotspot.hide{
  display:none;
}

.hotspot:active{
  transform:scale(.92);
}

@keyframes bob{
  50%{
    transform:translateY(-5px) scale(1.05);
  }
}

.hs-engine{left:29%;top:24%}
.hs-wheel{left:12%;top:63%}
.hs-light{left:5%;top:40%}
.hs-body{right:23%;top:54%}
.hs-hood{right:35%;top:27%}

/* -------------------------------------------------------
   CHARACTER
------------------------------------------------------- */

.player{
  position:absolute;
  z-index:13;
  left:29%;
  bottom:31%;
  width:48px;
  height:86px;
  transition:left .08s linear,bottom .08s linear,transform .15s;
}

.player .head{
  width:24px;
  height:24px;
  margin:auto;
  border-radius:50%;
  background:#d7976c;
  border:2px solid #8e5540;
}

.player .body{
  position:absolute;
  left:9px;
  top:23px;
  width:30px;
  height:40px;
  border-radius:12px 12px 7px 7px;
  background:linear-gradient(#f1ae36,#a86110);
}

.player .arm1,
.player .arm2{
  position:absolute;
  top:28px;
  width:8px;
  height:32px;
  border-radius:10px;
  background:#c98556;
}

.player .arm1{left:2px;transform:rotate(24deg)}
.player .arm2{right:2px;transform:rotate(-24deg)}

.player .leg1,
.player .leg2{
  position:absolute;
  top:57px;
  width:9px;
  height:30px;
  border-radius:10px;
  background:#3b4650;
}

.player .leg1{left:10px;transform:rotate(7deg)}
.player .leg2{right:10px;transform:rotate(-7deg)}

/* -------------------------------------------------------
   CONTROLS
------------------------------------------------------- */

.controls{
  position:absolute;
  z-index:60;
  left:15px;
  right:15px;
  bottom:14px;
  display:flex;
  align-items:end;
  justify-content:space-between;
  pointer-events:none;
}

.joystick-zone{
  width:138px;
  height:138px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(8,16,21,.55);
  backdrop-filter:blur(7px);
  position:relative;
  pointer-events:auto;
}

.joystick-ring{
  position:absolute;
  inset:17px;
  border-radius:50%;
  border:2px solid rgba(113,158,174,.23);
}

.joystick{
  position:absolute;
  left:50%;
  top:50%;
  width:58px;
  height:58px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:linear-gradient(#34505c,#17262f);
  border:2px solid #56717e;
  box-shadow:0 8px 18px rgba(0,0,0,.35);
}

.right-controls{
  display:grid;
  grid-template-columns:repeat(2,70px);
  gap:9px;
  pointer-events:auto;
}

.control-btn{
  width:70px;
  height:58px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(11,23,30,.92);
  font-size:24px;
  box-shadow:0 8px 22px rgba(0,0,0,.34);
}

.control-btn span{
  display:block;
  margin-top:1px;
  font-size:10px;
  color:#a8bac4;
}

.control-btn.blue{
  background:linear-gradient(135deg,#0b91cf,#075f8d);
}

.control-btn.orange{
  background:linear-gradient(135deg,#db8700,#a95200);
}

.control-btn.green{
  background:linear-gradient(135deg,#1d9e70,#11664b);
}

/* -------------------------------------------------------
   ACTION BAR
------------------------------------------------------- */

.action-panel{
  position:absolute;
  z-index:62;
  left:50%;
  bottom:145px;
  width:min(94%,690px);
  transform:translateX(-50%);
  padding:8px;
  border:1px solid rgba(94,130,144,.28);
  border-radius:20px;
  background:rgba(7,14,19,.87);
  backdrop-filter:blur(12px);
}

.action-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.action-btn{
  min-height:50px;
  border-radius:14px;
  background:#13252d;
  border:1px solid #2d4651;
  font-size:12px;
  font-weight:900;
}

.action-btn.blue{background:linear-gradient(135deg,#0d91d0,#08669c)}
.action-btn.orange{background:linear-gradient(135deg,#d98c0a,#ae5c00)}
.action-btn.green{background:linear-gradient(135deg,#1a9c72,#12654d)}

/* -------------------------------------------------------
   MENU / MODALS
------------------------------------------------------- */

.modal-bg{
  position:absolute;
  z-index:100;
  inset:0;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(1,5,8,.72);
  backdrop-filter:blur(10px);
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:min(760px,100%);
  max-height:88%;
  overflow:auto;
  padding:18px;
  border-radius:28px 28px 0 0;
  border:1px solid #304a56;
  background:linear-gradient(#11202a,#081116);
  box-shadow:0 -25px 80px rgba(0,0,0,.55);
  animation:up .22s ease;
}

@keyframes up{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.modal-head h2{
  margin:0;
  font-size:27px;
}

.close-btn{
  width:44px;
  height:44px;
  border-radius:14px;
  background:#1a2c35;
  font-size:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:14px;
}

.card{
  padding:14px;
  border-radius:18px;
  border:1px solid #263e49;
  background:#0b171e;
}

.card-title{
  font-weight:900;
  margin-bottom:5px;
}

.card-text{
  color:#9fb0ba;
  font-size:12px;
  line-height:1.45;
}

.card-value{
  font-size:24px;
  font-weight:900;
  margin-top:7px;
}

.blue-text{color:var(--cyan)}
.green-text{color:var(--green)}
.yellow-text{color:var(--yellow)}
.red-text{color:var(--red)}

.full-btn{
  width:100%;
  margin-top:13px;
  min-height:52px;
  border-radius:16px;
  background:linear-gradient(135deg,#0994d0,#0870a6);
  font-weight:900;
}

.scan-box{
  margin-top:13px;
  border:1px solid #28424d;
  border-radius:18px;
  overflow:hidden;
  background:#061016;
}

.scan-head{
  padding:12px;
  display:flex;
  justify-content:space-between;
  background:#10212a;
  font-size:12px;
  font-weight:800;
}

.scan-progress{
  height:5px;
  background:#13262f;
}

.scan-progress div{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#24d9ff,#89f7ff);
  transition:.2s;
}

.log{
  min-height:145px;
  padding:12px;
  color:#81eef8;
  font:12px monospace;
  white-space:pre-wrap;
}

.repair-area{
  position:relative;
  margin-top:13px;
  height:230px;
  border:1px solid #29444f;
  border-radius:19px;
  overflow:hidden;
  background:
    radial-gradient(circle at center,rgba(32,111,129,.18),transparent 45%),
    #071117;
}

.repair-label{
  position:absolute;
  top:25px;
  left:0;
  right:0;
  text-align:center;
  color:#b5c7d0;
  font-weight:800;
  font-size:13px;
}

.repair-bar{
  position:absolute;
  left:10%;
  right:10%;
  top:100px;
  height:25px;
  border-radius:20px;
  background:#1a2931;
}

.good-zone{
  position:absolute;
  left:44%;
  width:12%;
  top:0;
  bottom:0;
  background:#49e3a1;
  box-shadow:0 0 16px #49e3a1;
}

.needle{
  position:absolute;
  top:85px;
  left:10%;
  width:4px;
  height:55px;
  border-radius:4px;
  background:#fff;
  box-shadow:0 0 15px white;
}

.repair-button{
  position:absolute;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  width:175px;
  min-height:46px;
  border-radius:14px;
  background:#167faa;
  font-weight:900;
}

/* -------------------------------------------------------
   TOAST
------------------------------------------------------- */

.toast{
  position:absolute;
  z-index:200;
  left:50%;
  top:18px;
  transform:translate(-50%,-140px);
  max-width:90%;
  white-space:nowrap;
  padding:13px 17px;
  border-radius:14px;
  border:1px solid #34515e;
  background:#10212a;
  box-shadow:0 15px 35px rgba(0,0,0,.45);
  font-weight:900;
  transition:.3s;
}

.toast.show{
  transform:translate(-50%,0);
}

/* -------------------------------------------------------
   MOBILE
------------------------------------------------------- */

@media(max-width:520px){
  .quest{
    top:93px;
  }

  .quest-title{
    font-size:21px;
  }

  .action-panel{
    bottom:145px;
  }

  .action-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .car{
    width:94vw;
    height:40vw;
  }

  .cards{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-height:720px){
  .quest{
    padding:10px;
  }

  .quest-text{
    font-size:11px;
  }

  .car{
    top:54%;
  }

  .action-panel{
    bottom:138px;
  }
}
</style>
</head>

<body>

<div id="game">

  <!-- BACKGROUND -->
  <div class="garage-bg">
    <div class="wall"></div>
    <div class="wall-lines"></div>

    <div class="work-lights">
      <div class="work-light"></div>
      <div class="work-light"></div>
      <div class="work-light"></div>
      <div class="work-light"></div>
    </div>

    <div class="panel-wall"></div>

    <div class="tool-cabinet">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>

    <div class="floor"></div>
  </div>

  <!-- HUD -->
  <div class="top-ui">
    <div class="logo-box">
      <div class="logo-title">🔧 CAR REPAIR CENTER</div>
      <div class="logo-sub" id="subTitle">Автомайстерня • Рівень 1</div>
    </div>

    <div class="money-box">
      💰 <span id="money">$1840</span>
    </div>
  </div>

  <div class="quest">
    <div class="quest-title" id="questTitle">ПРИЙМАННЯ АВТОМОБІЛЯ</div>

    <div class="quest-text" id="questText">
      Підійди до автомобіля та оглянь його. Знайди несправні деталі.
    </div>

    <div class="quest-progress">
      <div id="progressBar"></div>
    </div>
  </div>

  <!-- WORLD -->
  <div class="world">

    <div class="game-camera" id="camera">

      <div class="car-shadow"></div>

      <!-- PLAYER -->
      <div class="player" id="player">
        <div class="head"></div>
        <div class="body"></div>
        <div class="arm1"></div>
        <div class="arm2"></div>
        <div class="leg1"></div>
        <div class="leg2"></div>
      </div>

      <!-- CAR -->
      <div class="car" id="car">

        <svg class="car-svg"
             viewBox="0 0 900 460"
             xmlns="http://www.w3.org/2000/svg">

          <defs>

            <linearGradient id="bodyPaint" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#e44d59"/>
              <stop offset="48%" stop-color="#aa2738"/>
              <stop offset="100%" stop-color="#4a1019"/>
            </linearGradient>

            <linearGradient id="glassPaint" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#23566c"/>
              <stop offset="45%" stop-color="#0b2633"/>
              <stop offset="100%" stop-color="#051116"/>
            </linearGradient>

            <linearGradient id="rubber" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#141a1e"/>
              <stop offset="100%" stop-color="#020304"/>
            </linearGradient>

            <filter id="lightGlow">
              <feGaussianBlur stdDeviation="5" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>

          </defs>

          <!-- shadow -->
          <ellipse cx="450" cy="407" rx="350" ry="28"
                   fill="#000" opacity=".6"/>

          <!-- BODY -->
          <path id="carBody"
            d="M75 320
               C77 274 113 244 167 237
               L259 226
               L328 147
               C350 122 380 110 420 110
               L566 110
               C605 110 637 126 664 156
               L728 232
               C787 242 820 270 823 321
               L823 356
               C823 388 799 407 764 411
               L136 411
               C100 407 75 386 75 356Z"
            fill="url(#bodyPaint)"
            stroke="#340c15"
            stroke-width="7"/>

          <!-- ROOF FRAME -->
          <path
            d="M257 226L328 147C350 122 380 110 420 110H566C605 110 637 126 664 156L728 232"
            fill="none"
            stroke="#e35963"
            stroke-width="10"/>

          <!-- GLASS -->
          <path id="window1"
            d="M283 219L343 151C356 136 382 128 408 128H426V219Z"
            fill="url(#glassPaint)"
            stroke="#233b47"
            stroke-width="6"/>

          <path id="window2"
            d="M441 128H564C588 128 610 140 628 161L672 219H441Z"
            fill="url(#glassPaint)"
            stroke="#233b47"
            stroke-width="6"/>

          <!-- WINDOW REFLECTION -->
          <path d="M350 154L394 139L378 214H323Z"
                fill="#a8f5ff" opacity=".12"/>

          <path d="M474 141L534 139L523 211L469 211Z"
                fill="#b5f8ff" opacity=".08"/>

          <!-- HOOD -->
          <path id="hoodPart"
            d="M75 320
               C79 277 115 246 167 239
               L259 228
               L328 221
               L345 283
               L322 351
               L78 351Z"
            fill="url(#bodyPaint)"
            stroke="#65131e"
            stroke-width="6"/>

          <!-- DOOR -->
          <path id="doorPart"
            d="M331 225L441 225V348H319V279Z"
            fill="#9f2230"
            stroke="#5e1720"
            stroke-width="4"/>

          <path
            d="M451 225H645C675 229 695 243 711 263L720 349H451Z"
            fill="#961f2d"
            stroke="#5e1720"
            stroke-width="4"/>

          <!-- HANDLE -->
          <rect x="542" y="249"
                width="40"
                height="7"
                rx="4"
                fill="#e1e8eb"
                opacity=".65"/>

          <!-- FRONT LIGHT -->
          <path id="lightPart"
            d="M100 294
               Q129 272 164 279
               L165 319

function setProgress(value){
  const n = Math.max(0,Math.min(100,value));
  $("progressBar").style.width=n+"%";
}

  $("money").textContent=money(state.money);

    `${car.name} • ${car.type}. Оглянь автомобіль, знайди несправності та відремонтуй їх.`;

  updateProgress();
}

function updateProgress(){

  const total=currentCar().faults.length;
  const found=state.detected.size;
  const done=state.fixed.size;

  let value=0;

  if(total>0){
    value=
      10+
      (found/total)*35+
      (done/total)*50;
  }

  if(done>=total){
    value=100;
  }

  setProgress(value);

  if(done>=total){
    $("questTitle").textContent="АВТО ГОТОВЕ ✅";
  }
  else if(found>=total){
    $("questTitle").textContent="УСІ ПРОБЛЕМИ ЗНАЙДЕНІ";
  }
  else if(found>0){
    $("questTitle").textContent="ДІАГНОСТИКА ПРОДОВЖУЄТЬСЯ";
  }
  else{
    $("questTitle").textContent="ПРИЙМАННЯ АВТОМОБІЛЯ";
  }
}

--------------------------------------------------------- */

function setPaint(color){

  const stop1=document.querySelector("#carBody stop:nth-child(1)");
  const stop2=document.querySelector("#carBody stop:nth-child(2)");
  const stop3=document.querySelector("#carBody stop:nth-child(3)");

  if(stop1) stop1.setAttribute("stop-color",lighten(color));
  if(stop2) stop2.setAttribute("stop-color",color);
  if(stop3) stop3.setAttribute("stop-color",darken(color));

  const hood=$("hoodPart");

  if(hood){
    const fills=hood.querySelectorAll("stop");

    if(fills[0]) fills[0].setAttribute("stop-color",lighten(color));
    if(fills[1]) fills[1].setAttribute("stop-color",color);
    if(fills[2]) fills[2].setAttribute("stop-color",darken(color));
  }
}

function hexToRgb(hex){
  const c=hex.replace("#","");

  const full=c.length===3
    ? c.split("").map(x=>x+x).join("")
    : c;

  return {
    r:parseInt(full.substring(0,2),16),
    g:parseInt(full.substring(2,4),16),
    b:parseInt(full.substring(4,6),16)
  };
}

function rgbHex(r,g,b){
  return "#"+[r,g,b]
    .map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0"))
    .join("");
}

function lighten(hex){
  const c=hexToRgb(hex);
  return rgbHex(c.r+45,c.g+45,c.b+45);
}

function darken(hex){
  const c=hexToRgb(hex);
  return rgbHex(c.r*.55,c.g*.55,c.b*.55);
}

function prepareCar(){

  const car=currentCar();

  setPaint(car.color);

  state.detected=new Set();
  state.fixed=new Set();

  const hot={
    engine:$("engineHotspot"),
    wheel:$("wheelHotspot"),
    light:$("lightHotspot"),
    hood:$("hoodHotspot"),
    body:$("bodyHotspot")
  };

  Object.keys(hot).forEach(key=>{
    hot[key].classList.toggle("hide",!car.faults.includes(key));
  });

  document.querySelectorAll(".hotspot").forEach(btn=>{
    btn.style.borderColor="var(--cyan)";
    btn.style.boxShadow="0 0 18px rgba(49,220,255,.35)";
  });

  $("car").classList.remove("lifted");

  state.hoodOpen=false;
  state.lifted=false;

  $("openHoodBtn").textContent="🔓 КАПОТ";
  $("liftBtn").textContent="⬆️ ПІДЙОМНИК";

  updateHud();
}

/* ---------------------------------------------------------
   FIND FAULT
--------------------------------------------------------- */

function inspectFault(type){

  const car=currentCar();

  if(!car.faults.includes(type)){
    toast("✅ Тут несправність не знайдена.");
    return;
  }

  state.detected.add(type);

  pulsePart(type);

  showDiagnostic(type);

  updateProgress();

  if(state.detected.size===car.faults.length){
    toast("🔥 Усі несправності знайдено!");
  }else{
    toast(
      `${faultInfo[type].icon} Виявлено: ${faultInfo[type].name}`
    );
  }
}

function pulsePart(type){

  const target={
    engine:$("carBody"),
    wheel:$("wheelsPart"),
    light:$("lightPart"),
    hood:$("hoodPart"),
    body:$("doorPart")
  }[type];

  if(!target) return;

  target.style.filter=
    "drop-shadow(0 0 5px #fff) drop-shadow(0 0 17px #30ddff)";

  setTimeout(()=>{
    target.style.filter="";
  },1600);
}

/* ---------------------------------------------------------
   REPAIR MINI GAME
--------------------------------------------------------- */

let repairTimer=null;
let needle=10;
let direction=1;
let repairType=null;

function startRepair(type){

  repairType=type;

  clearInterval(repairTimer);

  openModal(`
    <div class="modal-head">

      <div>
        <div class="green-text"
             style="font-size:12px;font-weight:900">
          SERVICE BAY
        </div>

        <h2>🔧 Ремонт ${faultInfo[type].name}</h2>
      </div>

      <button class="close-btn" data-close>✕</button>

    </div>

    <div class="card-text" style="margin-top:10px">
      Натисни кнопку, коли індикатор потрапить у зелену зону.
    </div>

    <div class="repair-area">

      <div class="repair-label">
        ТОЧНЕ НАЛАШТУВАННЯ
      </div>

      <div class="repair-bar">
        <div class="good-zone"></div>
      </div>

      <div class="needle" id="repairNeedle"></div>

      <button class="repair-button" id="repairHitBtn">
        🔧 ЗАФІКСУВАТИ
      </button>

    </div>
  `);

  needle=10;
  direction=1;

  repairTimer=setInterval(()=>{

    needle += direction*2.3;

    if(needle>=90){
      needle=90;
      direction=-1;
    }

    if(needle<=10){
      needle=10;
      direction=1;
    }

    const n=$("repairNeedle");

    if(n){
      n.style.left=needle+"%";
    }

  },35);

  $("repairHitBtn").addEventListener("click",finishRepair);
}

function finishRepair(){

  clearInterval(repairTimer);

  const type=repairType;

  const accuracy=
    Math.max(
      0,
      100-Math.abs(needle-50)*2
    );

  let multiplier=1;

  if(accuracy>=92){
    multiplier=1.5;
  }
  else if(accuracy>=78){
    multiplier=1.25;
  }
  else if(accuracy>=60){
    multiplier=1.1;
  }

  const base=
    faultInfo[type].cost+
    state.level*12;

  const payment=
    Math.floor(base*multiplier);

  state.fixed.add(type);

  closeModal();

  state.money += payment;

  addXP(
    70+
    Math.floor(accuracy)
  );

  toast(
    `✅ ${faultInfo[type].name} відремонтовано • +${money(payment)}`
  );

  save();
  updateHud();

  if(
    state.fixed.size >=
    currentCar().faults.length
  ){
    setTimeout(finishCar,500);
  }
}

}

function nextCar(){

  state.carIndex=
    (state.carIndex+1)%
    cars.length;

  prepareCar();

  closeModal();

  toast(

  );
}

/* ---------------------------------------------------------
   XP
--------------------------------------------------------- */

function addXP(amount){

  state.xp += amount;

  let need=
    state.level*500;

  while(state.xp>=need){

    state.xp-=need;
    state.level++;

    toast(
      `🔥 Новий рівень: ${state.level}!`
    );

    need=state.level*500;
  }

  save();
  updateHud();
}

function openModal(content){

  $("modal").innerHTML=content;
  $("modalBg").classList.add("show");

  document.querySelectorAll("[data-close]").forEach(btn=>{
    btn.addEventListener("click",closeModal);
  });
}

function closeModal(){

  $("modalBg").classList.remove("show");

  clearInterval(repairTimer);
}

$("modalBg").addEventListener("click",e=>{
  if(e.target===$("modalBg")){
    closeModal();
  }
});

/* ---------------------------------------------------------
   PLAYER MOVEMENT
--------------------------------------------------------- */

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function movePlayer(dx,dy){

  state.playerX += dx;
  state.playerY += dy;

  state.playerX=
    clamp(state.playerX,8,82);

  state.playerY=
    clamp(state.playerY,19,58);

  $("player").style.left=
    state.playerX+"%";

  $("player").style.bottom=
    state.playerY+"%";

  updateCamera();
}

function updateCamera(){

  const cx=(state.playerX-45)*.12;
  const cy=(state.playerY-38)*.04;

  $("camera").style.transform=
    `translate(${-cx}px,${cy}px)`;
}

/* ---------------------------------------------------------
   TOUCH JOYSTICK
--------------------------------------------------------- */

const joystickZone=$("joystickZone");
const joystick=$("joystick");

let touchStartX=0;
let touchStartY=0;

function joystickMove(clientX,clientY){

  const r=
    joystickZone.getBoundingClientRect();

  const centerX=
    r.left+r.width/2;

  const centerY=
    r.top+r.height/2;

  let dx=clientX-centerX;
  let dy=clientY-centerY;

  const max=42;

  const len=Math.sqrt(dx*dx+dy*dy);

  if(len>max){
    dx=dx/len*max;
    dy=dy/len*max;
  }

  joystick.style.transform=
    `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;

  movePlayer(dx/max*.7,-dy/max*.55);
}

function joystickReset(){

  joystick.style.transform=
    "translate(-50%,-50%)";
}

joystickZone.addEventListener("touchstart",e=>{
  e.preventDefault();

  state.joystickActive=true;
  state.joystickId=e.changedTouches[0].identifier;

  const t=e.changedTouches[0];

  touchStartX=t.clientX;
  touchStartY=t.clientY;

},{passive:false});

joystickZone.addEventListener("touchmove",e=>{
  e.preventDefault();

  if(!state.joystickActive) return;

  for(const t of e.changedTouches){

    if(t.identifier===state.joystickId){

      joystickMove(
        t.clientX,
        t.clientY
      );

      break;
    }
  }

},{passive:false});

joystickZone.addEventListener("touchend",e=>{
  e.preventDefault();

  state.joystickActive=false;
  joystickReset();

},{passive:false});

joystickZone.addEventListener("touchcancel",()=>{
  state.joystickActive=false;
  joystickReset();
});
