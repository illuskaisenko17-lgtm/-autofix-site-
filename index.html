<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Mechanics Hub</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(23, 27, 38, 0.85);
      --border-color: rgba(0, 242, 254, 0.2);
      --neon-cyan: #00f2fe;
      --neon-magenta: #ff007f;
      --neon-green: #39ff14;
      --neon-purple: #bc13fe;
      --text-main: #ffffff;
      --text-muted: #a0a5b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(188, 19, 254, 0.15), transparent 70%),
        linear-gradient(to bottom, #050608, #0b0c10);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 1280px;
      width: 100%;
    }

    /* Header Section */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.6),
                   0 0 20px rgba(0, 242, 254, 0.3);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--neon-cyan);
      border-radius: 8px;
      padding: 10px 15px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      width: 260px;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
    }

    /* Category Buttons (Navigation Carousel) */
    .categories {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 30px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .category-btn {
      flex: 1;
      min-width: 150px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-main);
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .category-btn:hover, .category-btn.active {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
      transform: translateY(-2px);
    }

    .category-btn.autos.active { border-color: var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan); }
    .category-btn.motos.active { border-color: var(--neon-magenta); box-shadow: 0 0 15px var(--neon-magenta); }
    .category-btn.pitbikes.active { border-color: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); }
    .category-btn.scooters.active { border-color: var(--neon-purple); box-shadow: 0 0 15px var(--neon-purple); }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease;
      position: relative;
      backdrop-filter: blur(5px);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    .card[data-type="autos"]:hover { border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); }
    .card[data-type="motos"]:hover { border-color: var(--neon-magenta); box-shadow: 0 0 20px rgba(255, 0, 127, 0.3); }
    .card[data-type="pitbikes"]:hover { border-color: var(--neon-green); box-shadow: 0 0 20px rgba(57, 255, 20, 0.3); }
    .card[data-type="scooters"]:hover { border-color: var(--neon-purple); box-shadow: 0 0 20px rgba(188, 19, 254, 0.3); }

    .card-img-container {
      width: 100%;
      height: 180px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
      position: relative;
      background: #000;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .card-img-container img {
      transform: scale(1.08);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .card-tag {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-transform: uppercase;
    }

    .card-details {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 0.85rem;
    }

    .detail-label {
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .detail-value {
      font-weight: 600;
    }

    .price-value {
      color: var(--neon-cyan);
      font-weight: 700;
    }

    .btn-action {
      background: linear-gradient(90deg, rgba(255,255,255,0.05), rgba(255,255,255,0.15));
      border: 1px solid var(--neon-cyan);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      width: 100%;
      transition: all 0.3s ease;
    }

    .btn-action:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 15px var(--neon-cyan);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo">Cyber Mechanics Hub</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="FIND YOUR RIDE...">
      </div>
    </header>

    <!-- Categories Filters -->
    <div class="categories">
      <button class="category-btn autos active" onclick="filterCategory('all', this)">All Vehicles</button>
      <button class="category-btn autos" onclick="filterCategory('autos', this)">🚗 Autos</button>
      <button class="category-btn motos" onclick="filterCategory('motos', this)">🏍️ Motos</button>
      <button class="category-btn pitbikes" onclick="filterCategory('pitbikes', this)">🏎️ Pitbikes</button>
      <button class="category-btn scooters" onclick="filterCategory('scooters', this)">🛵 Scooters</button>
    </div>

    <!-- Vehicle Cards Grid -->
    <div class="grid" id="vehicleGrid">
      <!-- Cards will be populated dynamically -->
    </div>
  </div>

  <script>
    const vehicles = [
      {
        id: 1,
        title: "BMW M5 F90",
        type: "autos",
        service: "Engine Tuning",
        price: "15 000 UAH",
        image: "https://images.unsplash.com/photo-1555215695-3004980adade?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 2,
        title: "Audi R8 Cyber",
        type: "autos",
        service: "Stage 2 + Wrap",
        price: "22 000 UAH",
        image: "https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 3,
        title: "Nissan GT-R Nismo",
        type: "autos",
        service: "Full Custom Tuning",
        price: "28 000 UAH",
        image: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 4,
        title: "Yamaha R1 Neo",
        type: "motos",
        service: "ECU Remap",
        price: "12 000 UAH",
        image: "https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 5,
        title: "Ducati Panigale V4",
        type: "motos",
        service: "Exhaust & Tune",
        price: "18 500 UAH",
        image: "https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 6,
        title: "Pitster Pro LXR",
        type: "pitbikes",
        service: "Suspension & Engine",
        price: "9 500 UAH",
        image: "https://images.unsplash.com/photo-1579710039144-85d6da173898?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 7,
        title: "Kayo Evolution 140",
        type: "pitbikes",
        service: "Carb Tuning & Mods",
        price: "8 000 UAH",
        image: "https://images.unsplash.com/photo-1449426468159-d96dbf08f19f?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 8,
        title: "Vespa Custom Neon",
        type: "scooters",
        service: "Visual Neon & CVT",
        price: "6 500 UAH",
        image: "https://images.unsplash.com/photo-1520627977056-c307aeb9a625?auto=format&fit=crop&w=600&q=80"
      }
    ];

    function renderVehicles(items) {
      const grid = document.getElementById('vehicleGrid');
      grid.innerHTML = '';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-type', item.type);

        card.innerHTML = `
          <div class="card-img-container">
            <img src="${item.image}" alt="${item.title}">
          </div>
          <div class="card-header">
            <div class="card-title">${item.title}</div>
            <div class="card-tag">${item.type}</div>
          </div>
          <div class="card-details">
            <div>
              <div class="detail-label">Service:</div>
              <div class="detail-value">${item.service}</div>
            </div>
            <div>
              <div class="detail-label">Price:</div>
              <div class="price-value">${item.price}</div>
            </div>
          </div>
          <button class="btn-action">Book Appointment</button>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(category, element) {
      document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      if (category === 'all') {
        renderVehicles(vehicles);
      } else {
        const filtered = vehicles.filter(v => v.type === category);
        renderVehicles(filtered);
      }
    }

    // Search function
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = vehicles.filter(v => 
        v.title.toLowerCase().includes(query) || 
        v.service.toLowerCase().includes(query)
      );
      renderVehicles(filtered);
    });

    // Initial render
    renderVehicles(vehicles);
  </script>
</body>
</html>
