<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZONE: SURVIVAL</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050607;
  font-family: Arial, sans-serif;
  color: white;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

#top {
  position: absolute;
  top: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.panel {
  background: rgba(8,12,13,.72);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 14px;
  padding: 10px 13px;
  backdrop-filter: blur(8px);
  box-shadow: 0 5px 20px rgba(0,0,0,.35);
}

#hpBar {
  width: 170px;
  height: 10px;
  margin-top: 6px;
  border-radius: 10px;
  background: #252525;
  overflow: hidden;
}

#hp {
  width: 100%;
  height: 100%;
  background: #43d66b;
  transition: width .2s;
}

#ammo {
  font-size: 22px;
  font-weight: 800;
}

#message {
  position: absolute;
  left: 50%;
  top: 22%;
  transform: translateX(-50%);
  text-align: center;
  font-weight: 800;
  text-shadow: 0 3px 12px black;
}

#crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 26px;
  height: 26px;
  transform: translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after {
  content: "";
  position: absolute;
  background: rgba(255,255,255,.9);
}

#crosshair:before {
  width: 2px;
  height: 26px;
  left: 12px;
}

#crosshair:after {
  width: 26px;
  height: 2px;
  top: 12px;
}

#controls {
  position: absolute;
  inset: auto 0 0 0;
  height: 190px;
}

#joystick {
  position: absolute;
  left: 25px;
  bottom: 28px;
  width: 125px;
  height: 125px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  border: 2px solid rgba(255,255,255,.18);
}

#stick {
  position: absolute;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: rgba(255,255,255,.28);
  border: 1px solid rgba(255,255,255,.4);
  left: 33px;
  top: 33px;
}

.action {
  position: absolute;
  border: 1px solid rgba(255,255,255,.25);
  color: white;
  background: rgba(15,18,19,.75);
  width: 68px;
  height: 68px;
  border-radius: 50%;
  font-weight: 800;
  font-size: 13px;
}

#fire {
  right: 25px;
  bottom: 45px;
  background: rgba(150,35,25,.75);
}

#reload {
  right: 108px;
  bottom: 105px;
}

#loot {
  right: 25px;
  bottom: 125px;
}

#run {
  right: 108px;
  bottom: 25px;
}

#start {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  padding: 18px 30px;
  border: 0;
  border-radius: 16px;
  background: #d7a83e;
  color: #101010;
  font-size: 19px;
  font-weight: 900;
  box-shadow: 0 10px 35px rgba(0,0,0,.5);
}

.hidden {
  display: none !important;
}

#damage {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: rgba(170,0,0,.25);
  opacity: 0;
  transition: opacity .1s;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div id="top">
    <div class="panel">
      <b>☢ ZONE</b>
      <div style="font-size:12px;color:#aaa">Виживання</div>
      <div id="hpBar"><div id="hp"></div></div>
    </div>

    <div class="panel">
      <div>🔫 AK-STYLE</div>
      <div id="ammo">30 / 120</div>
    </div>
  </div>

  <div id="message">ЗОНА АКТИВНА</div>
  <div id="crosshair"></div>

  <div id="controls">
    <div id="joystick">
      <div id="stick"></div>
    </div>

    <button class="action" id="fire">ВОГОНЬ</button>
    <button class="action" id="reload">↻</button>
    <button class="action" id="loot">ЛУТ</button>
    <button class="action" id="run">БІГ</button>
  </div>

</div>

<div id="damage"></div>

<button id="start">▶ ПОЧАТИ ГРУ</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}

addEventListener("resize", resize);
resize();

let playing = false;
let hp = 100;
let ammo = 30;
let reserve = 120;
let score = 0;

const player = {
  x: 0,
  y: 0,
  angle: 0,
  speed: 2.8
};

let enemies = [];
let lootItems = [];
let bullets = [];

function spawnEnemies() {
  enemies = [];

  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = 250 + Math.random() * 900;

    enemies.push({
      x: Math.cos(a) * d,
      y: Math.sin(a) * d,
      hp: 100,
      alive: true,
      speed: .25 + Math.random() * .2
    });
  }
}

function spawnLoot() {
  lootItems = [];

  for (let i = 0; i < 25; i++) {
    lootItems.push({
      x: (Math.random()-.5) * 2200,
      y: (Math.random()-.5) * 2200,
      type: Math.random() > .5 ? "ammo" : "med"
    });
  }
}

function startGame() {
  playing = true;
  document.getElementById("start").classList.add("hidden");
  hp = 100;
  ammo = 30;
  reserve = 120;
  score = 0;

  player.x = 0;
  player.y = 0;

  spawnEnemies();
  spawnLoot();
}

document.getElementById("start")
  .addEventListener("click", startGame);

function worldToScreen(x,y) {
  const dx = x - player.x;
  const dy = y - player.y;

  const c = Math.cos(-player.angle);
  const s = Math.sin(-player.angle);

  return {
    x: W/2 + dx*c - dy*s,
    y: H/2 + dx*s + dy*c
  };
}

function drawWorld() {

  const gradient = ctx.createLinearGradient(0,0,0,H);
  gradient.addColorStop(0,"#142127");
  gradient.addColorStop(.5,"#1c2721");
  gradient.addColorStop(1,"#090d0b");

  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,W,H);

  // земля
  ctx.fillStyle = "#273128";
  ctx.fillRect(0,H*.48,W,H*.52);

  // дальні дерева
  for (let i=-10;i<11;i++) {
    const x = W/2 + i*110;

    ctx.fillStyle = "#111b18";
    ctx.fillRect(x,H*.25,18,H*.25);

    ctx.beginPath();
    ctx.moveTo(x-70,H*.28);
    ctx.lineTo(x+9,H*.08);
    ctx.lineTo(x+88,H*.28);
    ctx.closePath();
    ctx.fill();
  }

  // дорога
  ctx.fillStyle = "#171a18";
  ctx.beginPath();
  ctx.moveTo(W*.43,H);
  ctx.lineTo(W*.57,H);
  ctx.lineTo(W*.53,H*.48);
  ctx.lineTo(W*.47,H*.48);
  ctx.closePath();
  ctx.fill();

  // будинки
  for(let i=0;i<7;i++) {
    const wx = -900 + i*300;
    const wy = -500 + (i%2)*500;

    const p = worldToScreen(wx,wy);

    if(p.x > -250 && p.x < W+250) {
      ctx.fillStyle = "#343a36";
      ctx.fillRect(p.x,p.y,130,100);

      ctx.fillStyle = "#202522";
      ctx.beginPath();
      ctx.moveTo(p.x-15,p.y);
      ctx.lineTo(p.x+65,p.y-55);
      ctx.lineTo(p.x+145,p.y);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#8a7b49";
      ctx.fillRect(p.x+25,p.y+35,22,25);
      ctx.fillRect(p.x+80,p.y+35,22,25);
    }
  }
}

function drawLoot() {

  for (const item of lootItems) {

    const p = worldToScreen(item.x,item.y);

    if(p.x < -40 || p.x > W+40 ||
       p.y < -40 || p.y > H+40) continue;

    ctx.fillStyle =
      item.type === "ammo" ? "#d3ad43" : "#4acb72";

    ctx.fillRect(p.x-8,p.y-8,16,16);

    ctx.font = "11px Arial";
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.fillText(
      item.type === "ammo" ? "AMMO" : "MED",
      p.x,
      p.y-14
    );
  }
}

function drawEnemy(e) {

  if(!e.alive) return;

  const p = worldToScreen(e.x,e.y);

  if(p.x < -100 || p.x > W+100 ||
     p.y < -100 || p.y > H+100) return;

  const dx = e.x-player.x;
  const dy = e.y-player.y;
  const distance = Math.sqrt(dx*dx+dy*dy);

  const size = Math.max(18,Math.min(65,4200/distance));

  // тінь
  ctx.fillStyle = "rgba(0,0,0,.45)";
  ctx.beginPath();
  ctx.ellipse(
    p.x,
    p.y+size*.7,
    size*.65,
    size*.22,
    0,0,Math.PI*2
  );
  ctx.fill();

  // тіло
  ctx.fillStyle = "#38444a";
  ctx.fillRect(
    p.x-size*.35,
    p.y-size*.05,
    size*.7,
    size*.75
  );

  // голова
  ctx.fillStyle = "#c6a58d";
  ctx.beginPath();
  ctx.arc(
    p.x,
    p.y-size*.3,
    size*.25,
    0,
    Math.PI*2
  );
  ctx.fill();

  // броня
  ctx.strokeStyle = "#161b1d";
  ctx.lineWidth = Math.max(2,size*.08);
  ctx.strokeRect(
    p.x-size*.35,
    p.y-size*.05,
    size*.7,
    size*.75
  );

  // зброя
  ctx.strokeStyle = "#111";
  ctx.lineWidth = Math.max(3,size*.1);
  ctx.beginPath();
  ctx.moveTo(p.x+size*.2,p.y+size*.15);
  ctx.lineTo(p.x+size*.7,p.y+size*.3);
  ctx.stroke();

  // HP
  ctx.fillStyle = "#111";
  ctx.fillRect(
    p.x-size*.5,
    p.y-size*.65,
    size,
    5
  );

  ctx.fillStyle = "#e74c3c";
  ctx.fillRect(
    p.x-size*.5,
    p.y-size*.65,
    size*(e.hp/100),
    5
  );
}

function drawPlayer() {

  ctx.save();

  ctx.translate(W/2,H/2);

  // руки
  ctx.fillStyle = "#b78f76";
  ctx.fillRect(-58,35,30,90);
  ctx.fillRect(28,35,30,90);

  // куртка
  ctx.fillStyle = "#263b32";
  ctx.fillRect(-45,-5,90,100);

  // голова
  ctx.fillStyle = "#c89e82";
  ctx.beginPath();
  ctx.arc(0,-45,32,0,Math.PI*2);
  ctx.fill();

  // шолом
  ctx.fillStyle = "#222a29";
  ctx.beginPath();
  ctx.arc(0,-52,34,Math.PI,Math.PI*2);
  ctx.fill();

  // зброя
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(10,25);
  ctx.lineTo(90,5);
  ctx.stroke();

  ctx.restore();
}

function drawFog() {

  const fog = ctx.createRadialGradient(
    W/2,H*.45,40,
    W/2,H*.45,Math.max(W,H)*.7
  );

  fog.addColorStop(0,"rgba(180,190,170,0)");
  fog.addColorStop(1,"rgba(40,50,45,.48)");

  ctx.fillStyle = fog;
  ctx.fillRect(0,0,W,H);
}

function draw() {

  drawWorld();
  drawLoot();

  enemies.forEach(drawEnemy);

  drawPlayer();
  drawFog();

  ctx.fillStyle = "rgba(255,255,255,.7)";
  ctx.font = "12px Arial";
  ctx.textAlign = "left";
  ctx.fillText(
    "Ворогів: " +
    enemies.filter(e=>e.alive).length,
    16,
    H-18
  );
}

let keys = {
  up:false,
  down:false,
  left:false,
  right:false,
  run:false
};

function update() {

  if(!playing) return;

  let speed = player.speed;

  if(keys.run) speed *= 1.7;

  if(keys.up) player.y -= speed;
  if(keys.down) player.y += speed;
  if(keys.left) player.x -= speed;
  if(keys.right) player.x += speed;

  // вороги рухаються до гравця
  enemies.forEach(e => {

    if(!e.alive) return;

    const dx = player.x-e.x;
    const dy = player.y-e.y;

    const d = Math.sqrt(dx*dx+dy*dy);

    if(d < 500 && d > 70) {
      e.x += dx/d*e.speed;
      e.y += dy/d*e.speed;
    }

    if(d < 65) {
      hp -= .05;

      if(hp <= 0) {
        hp = 0;
        playing = false;
        document.getElementById("message").textContent =
          "☠ ТИ ЗАГИНУВ";
        document.getElementById("start").textContent =
          "▶ ГРАТИ ЗНОВУ";
        document.getElementById("start").classList.remove("hidden");
      }
    }
  });

  // кулі
  bullets.forEach(b => {
    b.x += Math.cos(b.angle)*18;
    b.y += Math.sin(b.angle)*18;
    b.life--;
  });

  bullets = bullets.filter(b=>b.life>0);

  for(const b of bullets) {

    for(const e of enemies) {

      if(!e.alive) continue;

      const dx = e.x-b.x;
      const dy = e.y-b.y;

      if(Math.sqrt(dx*dx+dy*dy)<35) {

        e.hp -= 50;

        b.life = 0;

        if(e.hp <= 0) {
          e.alive = false;
          score += 100;

          document.getElementById("message").textContent =
            "☠ ВОРОГА ЗНИЩЕНО  +" + score;
        }
      }
    }
  }

  document.getElementById("hp").style.width = hp + "%";

  document.getElementById("ammo").textContent =
    ammo + " / " + reserve;
}

function loop() {

  update();
  draw();

  requestAnimationFrame(loop);
}

loop();

function shoot() {

  if(!playing) return;

  if(ammo <= 0) {
    document.getElementById("message").textContent =
      "Немає патронів!";
    return;
  }

  ammo--;

  bullets.push({
    x: player.x,
    y: player.y,
    angle: player.angle,
    life: 40
  });

  // маленький ефект попадання
  document.getElementById("crosshair").style.transform =
    "translate(-50%,-50%) scale(1.3)";

  setTimeout(()=>{
    document.getElementById("crosshair").style.transform =
      "translate(-50%,-50%) scale(1)";
  },70);
}

function reload() {

  if(!playing) return;

  const need = 30-ammo;

  if(need <= 0 || reserve <= 0) return;

  const take = Math.min(need,reserve);

  ammo += take;
  reserve -= take;

  document.getElementById("message").textContent =
    "Перезарядження...";
}

function damageFlash() {

  const d = document.getElementById("damage");

  d.style.opacity = "1";

  setTimeout(()=>{
    d.style.opacity = "0";
  },100);
}

document.getElementById("fire")
  .addEventListener("touchstart",e=>{
    e.preventDefault();
    shoot();
  });

document.getElementById("fire")
  .addEventListener("mousedown",shoot);

document.getElementById("reload")
  .addEventListener("click",reload);

document.getElementById("run")
  .addEventListener("touchstart",()=>{
    keys.run=true;
  });

document.getElementById("run")
  .addEventListener("touchend",()=>{
    keys.run=false;
  });

/* Джойстик */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joy = {
  active:false,
  id:null
};

joystick.addEventListener("touchstart",e=>{

  const t=e.changedTouches[0];

  joy.active=true;
  joy.id=t.identifier;

});

joystick.addEventListener("touchmove",e=>{

  if(!joy.active) return;

  let t=[...e.touches]
    .find(x=>x.identifier===joy.id);

  if(!t) return;

  const r=joystick.getBoundingClientRect();

  let x=t.clientX-(r.left+r.width/2);
  let y=t.clientY-(r.top+r.height/2);

  const max=43;
  const d=Math.sqrt(x*x+y*y);

  if(d>max) {
    x=x/d*max;
    y=y/d*max;
  }

  stick.style.transform =
    `translate(${x}px,${y}px)`;

  keys.left=x<-12;
  keys.right=x>12;
  keys.up=y<-12;
  keys.down=y>12;
});

function stopJoy() {

  joy.active=false;

  stick.style.transform="translate(0,0)";

  keys.left=false;
  keys.right=false;
  keys.up=false;
  keys.down=false;
}

joystick.addEventListener("touchend",stopJoy);
joystick.addEventListener("touchcancel",stopJoy);

/* Рух камерою пальцем по правій частині екрана */

let look = null;

canvas.addEventListener("touchstart",e=>{

  for(const t of e.changedTouches) {

    if(t.clientX > W*.45) {

      look={
        id:t.identifier,
        x:t.clientX
      };
    }
  }
});

canvas.addEventListener("touchmove",e=>{

  if(!look) return;

  const t=[...e.touches]
    .find(x=>x.identifier===look.id);

  if(!t) return;

  const dx=t.clientX-look.x;

  player.angle += dx*.012;

  look.x=t.clientX;
});

canvas.addEventListener("touchend",e=>{

  if(!look) return;

  const t=[...e.changedTouches]
    .find(x=>x.identifier===look.id);

  if(t) look=null;
});

/* Клавіатура для тестування */

addEventListener("keydown",e=>{

  if(e.key==="w") keys.up=true;
  if(e.key==="s") keys.down=true;
  if(e.key==="a") keys.left=true;
  if(e.key==="d") keys.right=true;
  if(e.key==="Shift") keys.run=true;

  if(e.key==="r") reload();
  if(e.key===" ") shoot();
});

addEventListener("keyup",e=>{

  if(e.key==="w") keys.up=false;
  if(e.key==="s") keys.down=false;
  if(e.key==="a") keys.left=false;
  if(e.key==="d") keys.right=false;
  if(e.key==="Shift") keys.run=false;
});

document.getElementById("loot")
  .addEventListener("click",()=>{

    if(!playing) return;

    let collected=0;

    lootItems=lootItems.filter(item=>{

      const dx=item.x-player.x;
      const dy=item.y-player.y;

      const d=Math.sqrt(dx*dx+dy*dy);

      if(d<100) {

        collected++;

        if(item.type==="ammo")
          reserve+=30;

        if(item.type==="med")
          hp=Math.min(100,hp+30);

        return false;
      }

      return true;
    });

    document.getElementById("message").textContent =
      collected ?
      "📦 Лут підібрано!" :
      "Немає луту поруч";
  });
</script>

</body>
</html>
