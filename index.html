<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Auto Mechanic Pro</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#071018;
  color:#fff;
}

button{
  font-family:inherit;
  cursor:pointer;
  border:0;
  color:white;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 25%,#263d49 0,#111d25 38%,#05090d 85%);
}

/* ---------------- GARAGE ---------------- */

.garage-wall{
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,
      transparent 0 9%,
      rgba(80,110,125,.15) 9% 10%,
      transparent 10% 90%,
      rgba(80,110,125,.15) 90% 91%,
      transparent 91%
    ),
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.025) 0 2px,
      transparent 2px 80px
    );
}

.floor{
  position:absolute;
  left:-20%;
  right:-20%;
  bottom:-15%;
  height:48%;
  transform:perspective(500px) rotateX(55deg);
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 70px,
      rgba(130,160,175,.12) 71px 73px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 70px,
      rgba(130,160,175,.10) 71px 73px
    );
}

.neon{
  position:absolute;
  top:8%;
  width:30%;
  height:5px;
  background:#a8f5ff;
  box-shadow:
    0 0 8px #52eaff,
    0 0 25px #52eaff,
    0 0 60px #52eaff;
}

.neon.left{left:5%}
.neon.right{right:5%}

/* ---------------- HUD ---------------- */

#hud{
  position:absolute;
  z-index:30;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  gap:8px;
}

.hud-box{
  min-height:58px;
  padding:10px 13px;
  border-radius:17px;
  border:1px solid #35515e;
  background:rgba(4,10,15,.91);
  box-shadow:0 8px 30px #0008;
  backdrop-filter:blur(8px);
}

.brand{
  flex:1;
  font-size:19px;
  font-weight:900;
}

.brand small{
  display:block;
  color:#9fb1bb;
  font-size:11px;
  margin-top:3px;
}

.cash{
  color:#ffd95a;
  font-size:19px;
  font-weight:900;
  white-space:nowrap;
}

/* ---------------- MISSION ---------------- */

#mission{
  position:absolute;
  z-index:25;
  left:10px;
  right:10px;
  top:77px;
  padding:13px 15px;
  border-radius:19px;
  background:rgba(4,10,15,.94);
  border:1px solid #304b58;
}

#missionTitle{
  font-size:21px;
  font-weight:900;
}

#missionText{
  margin-top:5px;
  color:#aebdc5;
  font-size:14px;
  line-height:1.3;
}

.progress{
  margin-top:9px;
  width:100%;
  height:6px;
  background:#1a2931;
  border-radius:20px;
  overflow:hidden;
}

#progressBar{
  width:0%;
  height:100%;
  background:#35dfff;
  box-shadow:0 0 14px #35dfff;
  transition:.3s;
}

/* ---------------- SCENE ---------------- */

#scene{
  position:absolute;
  z-index:5;
  top:205px;
  left:0;
  right:0;
  bottom:175px;
  display:flex;
  justify-content:center;
  align-items:center;
}

#car{
  position:relative;
  width:min(96vw,700px);
  height:420px;
  transition:.4s;
  filter:drop-shadow(0 35px 25px #000);
}

#car.lifted{
  transform:translateY(-60px) scale(.93);
}

.car-shadow{
  position:absolute;
  width:80%;
  height:65px;
  left:10%;
  bottom:22px;
  border-radius:50%;
  background:#000;
  opacity:.75;
  filter:blur(13px);
}

/* ---------------- CAR SVG ---------------- */

#carSVG{
  width:100%;
  height:100%;
  overflow:visible;
}

.part{
  transition:.2s;
}

.part.highlight{
  filter:
    drop-shadow(0 0 7px #3de8ff)
    drop-shadow(0 0 17px #3de8ff);
}

.part.broken{
  filter:
    drop-shadow(0 0 7px #ff4545)
    drop-shadow(0 0 18px #ff1515);
}

/* ---------------- CAR TARGETS ---------------- */

.target{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  border:2px solid #39ddff;
  background:rgba(8,35,45,.95);
  box-shadow:0 0 18px #39ddff88;
  font-size:21px;
  animation:pulse 1.2s infinite;
}

.target:active{
  transform:scale(.9);
}

@keyframes pulse{
  50%{
    box-shadow:
      0 0 8px #39ddff,
      0 0 30px #39ddff;
  }
}

.target-engine{
  left:45%;
  top:20%;
}

.target-wheel{
  left:9%;
  bottom:19%;
}

.target-light{
  right:7%;
  bottom:35%;
}

.target-body{
  right:31%;
  top:42%;
}

.target-battery{
  left:25%;
  top:31%;
}

/* ---------------- BOTTOM ---------------- */

#bottom{
  position:absolute;
  z-index:40;
  left:9px;
  right:9px;
  bottom:8px;
}

.main-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.main-buttons button{
  min-height:53px;
  border-radius:15px;
  font-weight:900;
  font-size:13px;
  border:1px solid #36505c;
  box-shadow:0 7px 15px #0007;
}

.blue{
  background:linear-gradient(135deg,#0fa8df,#076a9f);
}

.orange{
  background:linear-gradient(135deg,#ed9a00,#9c5000);
}

.green{
  background:linear-gradient(135deg,#16b67a,#08724d);
}

.tools{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  margin-top:7px;
}

.tool{
  min-height:53px;
  border-radius:13px;
  background:#101c24;
  border:1px solid #29434e;
  font-size:10px;
  font-weight:800;
}

.tool span{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

/* ---------------- MODAL ---------------- */

#modal{
  position:absolute;
  z-index:100;
  inset:0;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.72);
}

#modal.show{
  display:flex;
}

#panel{
  width:100%;
  max-height:82%;
  overflow:auto;
  padding:18px;
  border-radius:27px 27px 0 0;
  background:
    linear-gradient(#152630,#071015);
  border:1px solid #355361;
  box-shadow:0 -10px 40px #000;
}

.close{
  float:right;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#273942;
  font-size:18px;
}

.panel-title{
  font-size:24px;
  font-weight:900;
  margin-bottom:5px;
}

.panel-sub{
  color:#9eafb8;
  line-height:1.4;
}

.info{
  margin-top:13px;
  padding:13px;
  border-radius:15px;
  background:#0b171e;
  border:1px solid #253d48;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #1c3039;
}

.row:last-child{
  border-bottom:0;
}

.repair-button{
  width:100%;
  margin-top:12px;
  padding:16px;
  border-radius:15px;
  background:linear-gradient(135deg,#08b7ed,#0877ae);
  font-size:16px;
  font-weight:900;
}

/* ---------------- REPAIR MINI GAME ---------------- */

.repair-area{
  height:250px;
  margin-top:12px;
  border-radius:18px;
  background:#061015;
  border:1px solid #29444f;
  position:relative;
  overflow:hidden;
}

.repair-track{
  position:absolute;
  left:8%;
  right:8%;
  top:45%;
  height:28px;
  border-radius:20px;
  background:#1d2d35;
}

.repair-good{
  position:absolute;
  left:42%;
  width:16%;
  height:100%;
  background:#39e3a1;
  box-shadow:0 0 20px #39e3a1;
}

.needle{
  position:absolute;
  top:-12px;
  left:0;
  width:5px;
  height:52px;
  border-radius:5px;
  background:white;
  box-shadow:0 0 12px white;
}

.repair-hit{
  position:absolute;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  width:180px;
  padding:14px;
  border-radius:14px;
  background:#079bd1;
  font-size:15px;
  font-weight:900;
}

/* ---------------- TOAST ---------------- */

#toast{
  position:absolute;
  z-index:200;
  left:50%;
  top:18px;
  transform:translate(-50%,-130px);
  padding:12px 18px;
  border-radius:15px;
  background:#10232c;
  border:1px solid #365662;
  box-shadow:0 8px 25px #0008;
  font-weight:800;
  transition:.3s;
  white-space:nowrap;
}

#toast.show{
  transform:translate(-50%,0);
}

/* ---------------- MOBILE ---------------- */

@media(max-height:720px){

  #scene{
    top:190px;
    bottom:160px;
  }

  #car{
    transform:scale(.84);
  }

  #car.lifted{
    transform:translateY(-40px) scale(.78);
  }

  #mission{
    top:72px;
    padding:10px 12px;
  }

  #missionTitle{
    font-size:18px;
  }

  #missionText{
    font-size:12px;
  }

  .main-buttons button{
    min-height:47px;
    font-size:11px;
  }

  .tool{
    min-height:47px;
  }
}
</style>
</head>

<script>

/* =====================================================
   AUTO MECHANIC PRO
   GAME ENGINE
===================================================== */

const game = {

  money:2500,

  xp:0,

  level:1,

  repaired:0,

  carIndex:0,

  lifted:false,

  hood:false,

  selectedTool:"scanner",

  discovered:[],

  repairedParts:[]

};


/* =====================================================
   АВТОМОБІЛІ
===================================================== */

const cars = [

  {
    name:"BLUE STREET",
    type:"Sport Sedan",
    reward:650,
    faults:["engine","wheel","light"]
  },

  {
    name:"BLACK BEAST",
    type:"SUV",
    reward:850,
    faults:["wheel","battery","body"]
  },

  {
    name:"RED ROCKET",
    type:"Coupe",
    reward:1000,
    faults:["engine","light","body"]
  },

  {
    name:"SILVER GT",
    type:"Performance",
    reward:1400,
    faults:["engine","wheel","battery","light"]
  }

];


const partNames = {

  engine:"Двигун",

  wheel:"Колеса та підвіска",

  light:"Передня фара",

  body:"Кузов",

  battery:"Акумулятор"

};


/* =====================================================
   DOM
===================================================== */

const moneyElement =
  document.getElementById("money");

const missionTitle =
  document.getElementById("missionTitle");

const missionText =
  document.getElementById("missionText");

const progressBar =
  document.getElementById("progressBar");

const modal =
  document.getElementById("modal");

const panel =
  document.getElementById("panel");

const toastElement =
  document.getElementById("toast");

const carElement =
  document.getElementById("car");


/* =====================================================
   ОСНОВА
===================================================== */

function currentCar(){

  return cars[game.carIndex];

}


function updateHUD(){

  moneyElement.textContent =
    Math.floor(game.money);

}


function updateProgress(){

  const car=currentCar();

  const total=car.faults.length;

  const done=game.repairedParts.length;

  progressBar.style.width=
    Math.min(
      100,
      done/total*100
    )+"%";

}


/* =====================================================
   ПОВІДОМЛЕННЯ
===================================================== */

let toastTimer;

function toast(text){

  toastElement.textContent=text;

  toastElement.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{

    toastElement.classList.remove("show");

  },2200);

}


/* =====================================================
   ДІАГНОСТИКА
===================================================== */

function inspect(part){

  const car=currentCar();

  if(
    game.discovered.includes(part)
  ){

    if(
      game.repairedParts.includes(part)
    ){

      toast("✅ Ця деталь вже відремонтована");

    }else{

      openRepair(part);

    }

    return;
  }


  if(
    !car.faults.includes(part)
  ){

    toast(
      "🟢 "+partNames[part]+" працює нормально"
    );

    return;

  }


  game.discovered.push(part);

  highlightPart(part);

  missionTitle.textContent=
    "⚠️ ЗНАЙДЕНО НЕСПРАВНІСТЬ";

  missionText.textContent=
    partNames[part]+
    " потребує ремонту.";

  updateProgress();

  showDiagnostic(part);

}


/* =====================================================
   ПІДСВІТКА
===================================================== */

function highlightPart(part){

  const map={

    engine:"enginePart",

    wheel:"wheelPart",

    light:"lightPart",

    body:"doorPart",

    battery:"hoodPart"

  };

  const element=
    document.getElementById(map[part]);

  if(!element)return;

  element.classList.add("broken");

  setTimeout(()=>{

    element.classList.remove("broken");

  },1800);

}


/* =====================================================
   ДІАГНОСТИКА PANEL
===================================================== */

function showDiagnostic(part){

  modal.classList.add("show");

  panel.innerHTML=`

    <button
      class="close"
      onclick="closePanel()"
    >
      ✕
    </button>

    <div class="panel-title">
      📡 ДІАГНОСТИКА
    </div>

    <div class="panel-sub">
      Автомобіль: ${currentCar().name}
    </div>

    <div class="info">

      <div class="row">
        <span>Деталь</span>
        <b>${partNames[part]}</b>
      </div>

      <div class="row">
        <span>Стан</span>
        <b style="color:#ff5b5b">
          НЕСПРАВНО
        </b>
      </div>

      <div class="row">
        <span>Код помилки</span>
        <b>P-${randomCode()}</b>
      </div>

      <div class="row">
        <span>Ремонт</span>
        <b>$${repairPrice(part)}</b>
      </div>

    </div>

    <button
      class="repair-button"
      onclick="openRepair('${part}')"
    >
      🔧 ПОЧАТИ РЕМОНТ
    </button>

  `;

}


function randomCode(){

  return Math.floor(
    1000+Math.random()*8999
  );

}


function repairPrice(part){

  const prices={

    engine:220,

    wheel:160,

    light:90,

    body:180,

    battery:130

  };

  return prices[part]||100;

}


/* =====================================================
   РЕМОНТ
===================================================== */

let needleTimer=null;

let needlePosition=0;

let needleDirection=1;


function openRepair(part){

  modal.classList.add("show");

  panel.innerHTML=`

    <button
      class="close"
      onclick="closePanel()"
    >
      ✕
    </button>

    <div class="panel-title">
      🔧 РЕМОНТ
    </div>

    <div class="panel-sub">
      ${partNames[part]}
    </div>

    <div class="repair-area">

      <div class="repair-track">

        <div class="repair-good"></div>

        <div
          id="needle"
          class="needle"
        ></div>

      </div>

      <button
        class="repair-hit"
        onclick="finishRepair('${part}')"
      >
        ЗАФІКСУВАТИ
      </button>

    </div>

    <div class="info">

      <div class="row">
        <span>Порада</span>
        <b>
          Натисни в зеленій зоні
        </b>
      </div>

    </div>

  `;


  needlePosition=0;

  needleDirection=1;

  clearInterval(needleTimer);

  needleTimer=setInterval(()=>{

    needlePosition+=
      needleDirection*2;

    if(
      needlePosition>=100
    ){

      needlePosition=100;

      needleDirection=-1;

    }

    if(
      needlePosition<=0
    ){

      needlePosition=0;

      needleDirection=1;

    }

    const needle=
      document.getElementById("needle");

    if(needle){

      needle.style.left=
        needlePosition+"%";

    }

  },25);

}


/* =====================================================
   ЗАКІНЧЕННЯ РЕМОНТУ
===================================================== */

function finishRepair(part){

  clearInterval(needleTimer);

  const distance=
    Math.abs(
      needlePosition-50
    );

  let reward=100;

  if(distance<8){

    reward=220;

  }else if(distance<18){

    reward=170;

  }else if(distance<30){

    reward=130;

  }


  if(
    !game.repairedParts.includes(part)
  ){

    game.repairedParts.push(part);

  }


  game.money+=reward;

  game.xp+=80;

  game.repaired++;

  updateHUD();

  updateProgress();

  closePanel();

  toast(
    "🔧 Ремонт виконано +$"+reward
  );


  if(game.xp>=500){

    game.xp-=500;

    game.level++;

    toast(
      "🔥 НОВИЙ РІВЕНЬ "+game.level
    );

  }


  checkCarComplete();

}


/* =====================================================
   ЗАВЕРШЕННЯ АВТО
===================================================== */

function checkCarComplete(){

  const car=currentCar();

  if(
    game.repairedParts.length <
    car.faults.length
  ){

    return;

  }


  setTimeout(()=>{

    game.money+=car.reward;

    updateHUD();

    modal.classList.add("show");

    panel.innerHTML=`

      <div
        style="
        text-align:center;
        padding:10px 0 20px;
        "
      >

        <div
          style="
          font-size:65px;
          margin-bottom:8px;
          "
        >
          🏆
        </div>

        <div class="panel-title">
          АВТО ГОТОВЕ!
        </div>

        <div class="panel-sub">
          ${car.name} повністю
          відремонтовано.
        </div>

        <div class="info">

          <div class="row">
            <span>Оплата клієнта</span>
            <b style="color:#ffd95a">
              +$${car.reward}
            </b>
          </div>

          <div class="row">
            <span>Досвід</span>
            <b style="color:#39e3a1">
              +80 XP
            </b>
          </div>

          <div class="row">
            <span>Рівень</span>
            <b>
              ${game.level}
            </b>
          </div>

        </div>

        <button
          class="repair-button"
          onclick="nextCar()"
        >
          🚗 ПРИЙНЯТИ НОВЕ АВТО
        </button>

      </div>

    `;

  },600);

}


/* =====================================================
   НАСТУПНА МАШИНА
===================================================== */

function nextCar(){

  game.carIndex++;

  if(
    game.carIndex>=cars.length
  ){

    game.carIndex=0;

  }

  game.discovered=[];

  game.repairedParts=[];

  closePanel();

  const car=currentCar();

  missionTitle.textContent=
    "🚗 НОВИЙ КЛІЄНТ";

  missionText.textContent=
    car.name+
    " • "+
    car.type+
    ". Торкайся деталей і шукай проблеми.";

  updateProgress();

  toast(
    "🚘 Приїхав "+car.name
  );

}


/* =====================================================
   КАПОТ
===================================================== */

function toggleHood(){

  game.hood=!game.hood;

  if(game.hood){

    missionText.textContent=
      "🔓 Капот відкритий. Перевір двигун та акумулятор.";

    toast("🔓 Капот відкрито");

  }else{

    toast("🔒 Капот закрито");

    missionText.textContent=
      "Торкайся деталей автомобіля та знайди несправність.";

  }

}


/* =====================================================
   ПІДЙОМНИК
===================================================== */

function toggleLift(){

  game.lifted=!game.lifted;

  carElement.classList.toggle(
    "lifted",
    game.lifted
  );

  if(game.lifted){

    toast("⬆️ Автомобіль піднято");

    missionText.textContent=
      "⬆️ Авто на підйомнику. Перевір колеса та підвіску.";

  }else{

    toast("⬇️ Автомобіль опущено");

  }

}


/* =====================================================
   ІНСТРУМЕНТИ
===================================================== */

function selectTool(tool){

  game.selectedTool=tool;

  const names={

    scanner:"📡 Сканер вибрано",

    wrench:"🔧 Гайковий ключ вибрано",

    hammer:"🔨 Молоток вибрано",

    pump:"💨 Насос вибрано",

    battery:"🔋 АКБ вибрано"

  };

  toast(names[tool]);

}


/* =====================================================
   ГАРАЖ
===================================================== */

function openGarage(){

  modal.classList.add("show");

  panel.innerHTML=`

    <button
      class="close"
      onclick="closePanel()"
    >
      ✕
    </button>

    <div class="panel-title">
      🧰 МОЯ МАЙСТЕРНЯ
    </div>

    <div class="panel-sub">
      Твоя статистика механіка
    </div>

    <div class="info">

      <div class="row">
        <span>👨‍🔧 Рівень</span>
        <b>${game.level}</b>
      </div>

      <div class="row">
        <span>⭐ XP</span>
        <b>${game.xp}/500</b>
      </div>

      <div class="row">
        <span>🚗 Відремонтовано</span>
        <b>${game.repaired}</b>
      </div>

      <div class="row">
        <span>💰 Гроші</span>
        <b style="color:#ffd95a">
          $${game.money}
        </b>
      </div>

    </div>

    <div class="info">

      <div
        style="
        font-size:18px;
        font-weight:900;
        margin-bottom:7px;
        "
      >
        🏭 РОЗВИТОК МАЙСТЕРНІ
      </div>

      <div class="panel-sub">

        ${
          game.level<3
          ?"Маленький гараж"
          :game.level<6
          ?"Міська автомайстерня"
          :game.level<10
          ?"PRO AUTO CENTER"
          :"🏆 ELITE AUTO CENTER"
        }

      </div>

    </div>

    <button
      class="repair-button"
      onclick="nextCar()"
    >
      🚘 ПРИЙНЯТИ КЛІЄНТА
    </button>

  `;

}


/* =====================================================
   ЗАКРИТТЯ
===================================================== */

function closePanel(){

  modal.classList.remove("show");

  clearInterval(needleTimer);

}


modal.addEventListener(
  "click",
  function(e){

    if(e.target===modal){

      closePanel();

    }

  }
);


/* =====================================================
   СТАРТ
===================================================== */

updateHUD();

updateProgress();

setTimeout(()=>{

  toast(
    "🔧 Клієнт чекає! Знайди несправність."
  );

},700);

</script>

</body>
</html>
