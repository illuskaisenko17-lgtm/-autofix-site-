<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Zombie Survival 3D</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-user-select:none;
  user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#111;
}

#menu{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:
    linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.8)),
    radial-gradient(circle at center,#34472d,#080b08 70%);
  color:white;
  text-align:center;
}

#menu h1{
  font-size:42px;
  text-shadow:0 4px 15px black;
  margin-bottom:10px;
}

#menu p{
  color:#ccc;
  margin-bottom:30px;
}

#start{
  border:0;
  border-radius:14px;
  padding:18px 45px;
  font-size:21px;
  font-weight:bold;
  color:white;
  background:#e23b2f;
  box-shadow:0 7px 0 #8d211a,0 10px 30px #000;
  cursor:pointer;
}

#start:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #8d211a;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  display:none;
  color:white;
}

#stats{
  position:absolute;
  top:15px;
  left:15px;
  background:rgba(0,0,0,.5);
  padding:10px 14px;
  border-radius:12px;
  font-size:16px;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:30px;
  height:30px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 4px black;
}

#crosshair:before{
  width:2px;
  height:30px;
  left:14px;
}

#crosshair:after{
  height:2px;
  width:30px;
  top:14px;
}

#shoot{
  position:absolute;
  right:25px;
  bottom:30px;
  width:85px;
  height:85px;
  border-radius:50%;
  background:rgba(220,40,30,.75);
  border:3px solid white;
  pointer-events:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

#shoot:active{
  background:#ff3d30;
}

#info{
  position:absolute;
  bottom:15px;
  left:15px;
  font-size:13px;
  color:#ddd;
}

#message{
  position:absolute;
  top:90px;
  left:50%;
  transform:translateX(-50%);
  font-size:25px;
  font-weight:bold;
  text-shadow:0 2px 8px black;
}

#gameOver{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(0,0,0,.75);
  color:white;
}

#gameOver h2{
  font-size:40px;
  margin-bottom:20px;
}

#restart{
  padding:15px 35px;
  border:0;
  border-radius:12px;
  background:#e33;
  color:white;
  font-size:19px;
  font-weight:bold;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
  <h1>🧟 ZOMBIE SURVIVAL</h1>
  <p>3D-style мобільний шутер</p>
  <button id="start">ПОЧАТИ ГРУ</button>
</div>

<div id="hud">
  <div id="stats">
    ❤️ HP: <span id="hp">100</span><br>
    🔫 Патрони: <span id="ammo">30</span><br>
    🧟 Зомбі: <span id="zombies">0</span><br>
    ⭐ Хвиля: <span id="wave">1</span>
  </div>

  <div id="message"></div>
  <div id="crosshair"></div>

  <div id="info">
    Рухай телефоном/пальцем для прицілу • 🔴 стріляй
  </div>

  <button id="shoot">🔫</button>
</div>

<div id="gameOver">
  <h2>💀 ТИ ПРОГРАВ</h2>
  <button id="restart">ГРАТИ ЩЕ РАЗ</button>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const hud = document.getElementById("hud");
const start = document.getElementById("start");
const shoot = document.getElementById("shoot");
const restart = document.getElementById("restart");

const hpText = document.getElementById("hp");
const ammoText = document.getElementById("ammo");
const zombieText = document.getElementById("zombies");
const waveText = document.getElementById("wave");
const message = document.getElementById("message");

let W = 0;
let H = 0;

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

let playing = false;
let hp = 100;
let ammo = 30;
let wave = 1;
let score = 0;

let player = {
  x:0,
  y:0,
  angle:0
};

let zombies = [];
let bullets = [];

function randomZombie(){
  const side = Math.floor(Math.random()*4);

  let x,y;

  if(side === 0){
    x = Math.random()*W;
    y = -50;
  }

  if(side === 1){
    x = W+50;
    y = Math.random()*H;
  }

  if(side === 2){
    x = Math.random()*W;
    y = H+50;
  }

  if(side === 3){
    x = -50;
    y = Math.random()*H;
  }

  return {
    x:x,
    y:y,
    size:35 + Math.random()*15,
    speed:0.4 + Math.random()*0.5,
    hp:2
  };
}

function createWave(){
  zombies = [];

  const count = 5 + wave * 2;

  for(let i=0;i<count;i++){
    zombies.push(randomZombie());
  }

  waveText.textContent = wave;
}

function startGame(e){
  if(e){
    e.preventDefault();
  }

  if(playing) return;

  playing = true;

  hp = 100;
  ammo = 30;
  wave = 1;
  score = 0;

  menu.style.display = "none";
  hud.style.display = "block";
  document.getElementById("gameOver").style.display = "none";

  player.x = W/2;
  player.y = H/2;

  createWave();
  updateHUD();
}

start.addEventListener("click",startGame);
start.addEventListener("touchstart",startGame,{passive:false});

restart.addEventListener("click",startGame);

shoot.addEventListener("touchstart",function(e){
  e.preventDefault();
  shootZombie();
},{passive:false});

shoot.addEventListener("click",function(e){
  e.preventDefault();
  shootZombie();
});

function shootZombie(){

  if(!playing) return;

  if(ammo <= 0){
    message.textContent = "Немає патронів!";
    setTimeout(()=>message.textContent="",1000);
    return;
  }

  ammo--;

  let nearest = null;
  let nearestDistance = Infinity;

  for(const z of zombies){

    const dx = z.x - player.x;
    const dy = z.y - player.y;
    const distance = Math.sqrt(dx*dx+dy*dy);

    if(distance < nearestDistance){
      nearestDistance = distance;
      nearest = z;
    }
  }

  if(nearest && nearestDistance < 500){

    nearest.hp--;

    if(nearest.hp <= 0){
      zombies = zombies.filter(z=>z!==nearest);
      score++;
    }

  }

  updateHUD();
}

function updateHUD(){

  hpText.textContent = Math.max(0,Math.floor(hp));
  ammoText.textContent = ammo;
  zombieText.textContent = zombies.length;
}

function update(){

  if(!playing) return;

  for(const z of zombies){

    const dx = player.x-z.x;
    const dy = player.y-z.y;

    const distance = Math.sqrt(dx*dx+dy*dy);

    if(distance > 35){

      z.x += dx/distance*z.speed;
      z.y += dy/distance*z.speed;

    }else{

      hp -= 0.12;

    }
  }

  if(zombies.length === 0){

    wave++;

    message.textContent = "🔥 НОВА ХВИЛЯ!";

    setTimeout(()=>{
      message.textContent="";
    },1200);

    createWave();
  }

  if(hp <= 0){
    gameOver();
  }

  updateHUD();
}

function gameOver(){

  playing = false;

  document.getElementById("gameOver").style.display = "flex";
}

function drawBackground(){

  ctx.fillStyle = "#182519";
  ctx.fillRect(0,0,W,H);

  // земля
  ctx.fillStyle = "#29402b";

  for(let x=0;x<W;x+=50){

    for(let y=0;y<H;y+=50){

      ctx.strokeStyle = "rgba(255,255,255,.025)";
      ctx.strokeRect(x,y,50,50);

    }
  }

  // дорога
  ctx.fillStyle = "#303030";
  ctx.fillRect(0,H/2-55,W,110);

  ctx.fillStyle = "#d6b84a";

  for(let x=0;x<W;x+=80){
    ctx.fillRect(x,H/2-3,45,6);
  }

  // будинки
  drawBuilding(70,100,130,100);
  drawBuilding(W-210,90,140,110);
  drawBuilding(80,H-190,150,100);
  drawBuilding(W-240,H-180,160,110);

}

function drawBuilding(x,y,w,h){

  ctx.fillStyle="#4b4b4b";
  ctx.fillRect(x,y,w,h);

  ctx.fillStyle="#242424";

  for(let xx=x+20;xx<x+w-10;xx+=40){
    for(let yy=y+20;yy<y+h-10;yy+=35){
      ctx.fillRect(xx,yy,18,20);
    }
  }
}

function drawPlayer(){

  ctx.save();

  ctx.translate(player.x,player.y);

  // тінь
  ctx.fillStyle="rgba(0,0,0,.4)";
  ctx.beginPath();
  ctx.ellipse(0,20,22,10,0,0,Math.PI*2);
  ctx.fill();

  // тіло
  ctx.fillStyle="#2474d8";
  ctx.fillRect(-14,-5,28,30);

  // голова
  ctx.fillStyle="#e4b58c";
  ctx.beginPath();
  ctx.arc(0,-17,13,0,Math.PI*2);
  ctx.fill();

  // зброя
  ctx.rotate(player.angle);

  ctx.fillStyle="#171717";
  ctx.fillRect(10,-4,30,8);

  ctx.restore();
}

function drawZombie(z){

  const angle = Math.atan2(
    player.y-z.y,
    player.x-z.x
  );

  ctx.save();

  ctx.translate(z.x,z.y);

  // тінь
  ctx.fillStyle="rgba(0,0,0,.4)";
  ctx.beginPath();
  ctx.ellipse(0,20,22,9,0,0,Math.PI*2);
  ctx.fill();

  // тіло
  ctx.fillStyle="#4e873f";
  ctx.fillRect(-14,-5,28,30);

  // голова
  ctx.fillStyle="#86a85b";
  ctx.beginPath();
  ctx.arc(0,-18,14,0,Math.PI*2);
  ctx.fill();

  // очі
  ctx.fillStyle="#111";
  ctx.fillRect(-7,-20,4,4);
  ctx.fillRect(3,-20,4,4);

  // руки
  ctx.strokeStyle="#86a85b";
  ctx.lineWidth=7;

  ctx.beginPath();
  ctx.moveTo(-12,0);
  ctx.lineTo(-27,12);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(12,0);
  ctx.lineTo(27,12);
  ctx.stroke();

  ctx.restore();
}

function draw(){

  drawBackground();

  for(const z of zombies){
    drawZombie(z);
  }

  drawPlayer();

}

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);
}

loop();

let touching = false;

canvas.addEventListener("touchstart",function(e){

  touching=true;

},{passive:true});

canvas.addEventListener("touchmove",function(e){

  if(!playing || !touching) return;

  const touch=e.touches[0];

  player.angle = Math.atan2(
    touch.clientY-player.y,
    touch.clientX-player.x
  );

},{passive:true});

canvas.addEventListener("touchend",function(){

  touching=false;

});

document.addEventListener("keydown",function(e){

  if(e.code==="Space"){
    shootZombie();
  }

  if(e.code==="KeyR"){
    ammo=30;
    updateHUD();
  }

});

</script>

</body>
</html>
