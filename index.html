<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUTO & MOTO TUNING — DRIVE HYPER SERVICE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #08070d;
      color: #ffffff;
      padding-bottom: 50px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 15px;
    }

    /* Яркий неоновый баннер */
    .promo-banner {
      background: linear-gradient(90deg, #ff0055, #ff5500, #00f0ff);
      background-size: 200% 200%;
      animation: neonGradient 3s ease infinite;
      color: #fff;
      text-align: center;
      padding: 12px 10px;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
    }

    @keyframes neonGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Шапка сайта */
    .hero-card {
      background: linear-gradient(135deg, #120e24, #1a0b1c);
      border-radius: 20px;
      padding: 22px;
      margin-top: 20px;
      border: 2px solid #ff0055;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.25);
    }

    .hero-title {
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ff0055, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .badge {
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .badge-neon-green {
      background: rgba(0, 255, 136, 0.15);
      color: #00ff88;
      border: 1px solid #00ff88;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
    }

    .badge-neon-pink {
      background: rgba(255, 0, 85, 0.15);
      color: #ff0055;
      border: 1px solid #ff0055;
    }

    /* Поиск и Вкладки Категорий */
    .search-box {
      width: 100%;
      padding: 14px;
      background-color: #0c0a14;
      border: 2px solid #2a2040;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      margin-bottom: 15px;
      transition: all 0.3s;
    }

    .search-box:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .tab-btn {
      flex: 1;
      min-width: 90px;
      padding: 10px 12px;
      background: #141024;
      border: 1px solid #2a2040;
      color: #8f85b0;
      border-radius: 10px;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: #fff;
      border-color: #ff5500;
      box-shadow: 0 0 15px rgba(255, 85, 0, 0.5);
    }

    /* Карточки каталога */
    .catalog-card {
      background: #120e20;
      border-radius: 18px;
      overflow: hidden;
      margin-top: 20px;
      border: 1px solid #231b38;
      transition: all 0.3s;
      position: relative;
    }

    .catalog-card:hover {
      border-color: #00f0ff;
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0, 240, 255, 0.2);
    }

    .card-img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 18px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 800;
      color: #fff;
    }

    .tag {
      font-size: 10px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tag-cyan { background: #00f0ff; color: #000; }
    .tag-pink { background: #ff0055; color: #fff; }
    .tag-orange { background: #ff7700; color: #000; }
    .tag-purple { background: #a855f7; color: #fff; }

    .price-list {
      list-style: none;
      margin: 15px 0;
    }

    .price-item {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid #1c1530;
      font-size: 13px;
    }

    .price-item span {
      color: #c4bcdc;
    }

    .price-value {
      color: #00ff88 !important;
      font-weight: 800;
    }

    /* Яркие кнопки */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 900;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .btn-action {
      background: linear-gradient(90deg, #00f0ff, #00ff88);
      color: #000;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
    }

    .btn-action:hover {
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.7);
      transform: scale(1.01);
    }

    /* Модальное окно */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(4, 3, 8, 0.85);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-content {
      background: #120e20;
      border: 2px solid #00f0ff;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 450px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 12px; right: 18px;
      font-size: 26px;
      cursor: pointer;
      color: #ff0055;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      color: #00f0ff;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-group select, .form-group input {
      width: 100%;
      padding: 12px;
      background: #08070d;
      border: 1px solid #231b38;
      border-radius: 10px;
      color: #fff;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="promo-banner">
    ⚡ ТЮНІНГ & СЕРВІС 24/7 — ЗНИЖКА -20% НА ПЕРШИЙ ЗАПИС ⚡
  </div>

  <main class="container">
    <header class="hero-card">
      <div class="hero-title">
        <i class="fa-solid fa-bolt-lightning"></i> AUTO & MOTO HYPERFIX
      </div>

      <div class="badges">
        <span class="badge badge-neon-green"><i class="fa-solid fa-circle"></i> Сервіс Відкрито</span>
        <span class="badge badge-neon-pink"><i class="fa-solid fa-fire"></i> Stage 1 / 2 / 3</span>
      </div>

      <input type="text" id="search-input" class="search-box" placeholder="🔍 Введіть модель (BMW, Dio, Jog, Kayo, Pitster Pro...)">

      <div class="category-tabs">
        <button class="tab-btn active" data-filter="all"><i class="fa-solid fa-border-all"></i> Усі</button>
        <button class="tab-btn" data-filter="car"><i class="fa-solid fa-car-side"></i> Авто</button>
        <button class="tab-btn" data-filter="moto"><i class="fa-solid fa-motorcycle"></i> Мото</button>
        <button class="tab-btn" data-filter="scooter"><i class="fa-solid fa-moped"></i> Скутери</button>
        <button class="tab-btn" data-filter="pitbike"><i class="fa-solid fa-person-biking"></i> Пітбайки</button>
      </div>
    </header>

    <section id="catalog"></section>
  </main>

  <!-- Модальное окно -->
  <div id="booking-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeBookingModal()">&times;</span>
      <h3 style="font-weight: 900; text-transform: uppercase; margin-bottom: 5px;">Швидкий Запис</h3>
      <p id="modal-subtitle" style="color: #00ff88; font-size: 12px; margin-bottom: 15px; font-weight: 700;"></p>

      <form onsubmit="handleBooking(event)">
        <div class="form-group">
          <label>Оберіть майстра / бокс:</label>
          <select required>
            <option>Бокс №1 — Спец-авто / Тюнінг Stage</option>
            <option>Бокс №2 — Мототехніка та Спортбайки</option>
            <option>Бокс №3 — Скутери & Pitbike майстерня</option>
          </select>
        </div>

        <div class="form-group">
          <label>Ваш телефон / Telegram:</label>
          <input type="text" placeholder="@username або +380..." required>
        </div>

        <button type="submit" class="btn btn-action" style="margin-top: 10px;">
          <i class="fa-solid fa-paper-plane"></i> Підтвердити Запис
        </button>
      </form>
    </div>
  </div>

  <script>
    const catalogData = [
      // 🚗 АВТО
      {
        name: "BMW M5 F90 / M3 G80 / M4",
        category: "car",
        tag: "M-POWER",
        tagColor: "tag-pink",
        image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=800&q=80",
        services: [
          { name: "Чип-тюнінг Stage 2 + Popcorn (Pop & Bang)", price: "9 500 грн" },
          { name: "Обслуговування XDrive та КПП ZF8", price: "3 800 грн" },
          { name: "Комп'ютерна діагностика iDrive / ISTA", price: "500 грн" }
        ]
      },
      {
        name: "Mercedes-AMG C63 / E63S / GT Black Series",
        category: "car",
        tag: "V8 BITURBO",
        tagColor: "tag-orange",
        image: "https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=800&q=80",
        services: [
          { name: "Налаштування вихлопу та прошивка AMG", price: "8 000 грн" },
          { name: "Діагностика пневмопідвіски AIRMATIC", price: "800 грн" }
        ]
      },
      {
        name: "Audi RS6 Avant / RS7 / R8 V10",
        category: "car",
        tag: "QUATTRO SPORT",
        tagColor: "tag-cyan",
        image: "https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=800&q=80",
        services: [
          { name: "Заміна оливи в муфті Haldex / Quattro", price: "1 400 грн" },
          { name: "Чип-тюнінг двигуна 4.0 TFSI Stage 1", price: "8 500 грн" }
        ]
      },

      // 🏍️ МОТОЦИКЛЫ
      {
        name: "Yamaha YZF-R1 / R6 / MT-09",
        category: "moto",
        tag: "CROSSPLANE",
        tagColor: "tag-cyan",
        image: "https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=800&q=80",
        services: [
          { name: "Синхронізація інжектора та дроселів", price: "1 600 грн" },
          { name: "Заміна ланцюга, зірок та підготовка до треку", price: "1 300 грн" }
        ]
      },
      {
        name: "Kawasaki Ninja ZX-10R / H2 / Z1000",
        category: "moto",
        tag: "NINJA POWER",
        tagColor: "tag-orange",
        image: "https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?w=800&q=80",
        services: [
          { name: "Налаштування quickshifter (Квікшифтер)", price: "1 800 грн" },
          { name: "Заміна мастила Motul 300V + фільтр", price: "1 100 грн" }
        ]
      },

      // 🛵 СКУТЕРЫ
      {
        name: "Honda Dio 27/28/34/35 & AF-62/68",
        category: "scooter",
        tag: "JAPAN LEGEND",
        tagColor: "tag-purple",
        image: "https://images.unsplash.com/photo-1520256862855-398228c41684?w=800&q=80",
        services: [
          { name: "Налаштування карбюратора та заміна поршневої", price: "850 грн" },
          { name: "Тюнінг варіатора (ролики, ремінь DLH/Athena)", price: "600 грн" }
        ]
      },
      {
        name: "Yamaha Jog / Aerox 50-70cc",
        category: "scooter",
        tag: "STUNT / TUNING",
        tagColor: "tag-pink",
        image: "https://images.unsplash.com/photo-1591637333184-19aa84b3e01f?w=800&q=80",
        services: [
          { name: "Встановлення ЦПГ 70cc (Malossi Sport / Stage6)", price: "1 500 грн" },
          { name: "Налаштування зчеплення та пружин Торкдрайвера", price: "700 грн" }
        ]
      },

      // 🏁 ПИТБАЙКИ
      {
        name: "Kayo Evolution / Basic / TT140 / T2",
        category: "pitbike",
        tag: "PITBIKE HARD",
        tagColor: "tag-orange",
        image: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&q=80",
        services: [
          { name: "Регулювання теплових зазорів клапанів", price: "450 грн" },
          { name: "Чистка та налаштування карбюратора Nibbi PE22/28", price: "500 грн" },
          { name: "Перепакування та сервіс передньої вилки", price: "1 200 грн" }
        ]
      },
      {
        name: "BSE PH10 / Pitster Pro / Geon X-Pit 125-160cc",
        category: "pitbike",
        tag: "OFFROAD / STUNT",
        tagColor: "tag-pink",
        image: "https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?w=800&q=80",
        services: [
          { name: "Заміна ланцюга 428H + посилені зірки", price: "600 грн" },
          { name: "Встановлення дублера задніх гальм (для станту)", price: "1 400 грн" }
        ]
      }
    ];

    function renderCatalog(items) {
      const container = document.getElementById("catalog");
      container.innerHTML = "";

      if (items.length === 0) {
        container.innerHTML = "<p style='text-align: center; color: #8f85b0; padding: 30px;'>Нічого не знайдено під ваш запит.</p>";
        return;
      }

      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "catalog-card";
        card.innerHTML = `
          <img src="${item.image}" class="card-img" alt="${item.name}">
          <div class="card-content">
            <div class="card-header">
              <div class="card-title">${item.name}</div>
              <span class="tag ${item.tagColor}">${item.tag}</span>
            </div>
            <ul class="price-list">
              ${item.services.map(s => `
                <li class="price-item">
                  <span>${s.name}</span>
                  <span class="price-value">${s.price}</span>
                </li>
              `).join('')}
            </ul>
            <button class="btn btn-action" onclick="openBookingModal('${item.name}')">
              <i class="fa-solid fa-bolt"></i> Записатися на Сервіс
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    renderCatalog(catalogData);

    // Поиск и фильтры
    const searchInput = document.getElementById("search-input");
    const tabBtns = document.querySelectorAll(".tab-btn");
    let currentFilter = "all";

    searchInput.addEventListener("input", filterData);

    tabBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        tabBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.getAttribute("data-filter");
        filterData();
      });
    });

    function filterData() {
      const query = searchInput.value.toLowerCase();
      const filtered = catalogData.filter(item => {
        const matchesFilter = currentFilter === "all" || item.category === currentFilter;
        const matchesSearch = item.name.toLowerCase().includes(query) || item.tag.toLowerCase().includes(query);
        return matchesFilter && matchesSearch;
      });
      renderCatalog(filtered);
    }

    // Модальное окно
    const modal = document.getElementById("booking-modal");
    const modalSubtitle = document.getElementById("modal-subtitle");

    function openBookingModal(name) {
      modalSubtitle.textContent = `Модель: ${name}`;
      modal.style.display = "flex";
    }

    function closeBookingModal() {
      modal.style.display = "none";
    }

    function handleBooking(e) {
      e.preventDefault();
      alert("🔥 Успішно! Вашу заявку прийнято. Очікуйте повідомлення в Telegram.");
      closeBookingModal();
    }
  </script>
</body>
</html>
