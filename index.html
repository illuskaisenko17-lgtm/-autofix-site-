<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBER MECHANICS HUB</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c14;
      --card-bg: #101422;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --neon-green: #00ff66;
      --neon-purple: #b026ff;
      --text-main: #ffffff;
      --text-dim: #8a93b2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(0, 243, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 127, 0.05) 0%, transparent 40%);
      color: var(--text-main);
      padding: 20px 15px;
      min-height: 100vh;
    }

    /* Шапка сайту */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto 30px auto;
      flex-wrap: wrap;
      gap: 15px;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 243, 255, 0.5);
    }

    .search-box {
      position: relative;
    }

    .search-input {
      background: rgba(16, 20, 34, 0.8);
      border: 1px solid var(--neon-cyan);
      border-radius: 8px;
      padding: 10px 15px;
      color: var(--neon-cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      outline: none;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
      width: 220px;
      transition: all 0.3s;
    }

    .search-input:focus {
      box-shadow: 0 0 18px var(--neon-cyan);
    }

    /* Верхня навігація по категоріях */
    .categories-bar {
      display: flex;
      justify-content: center;
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto 35px auto;
      overflow-x: auto;
      padding: 5px;
    }

    .cat-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 25px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s;
      min-width: 160px;
      justify-content: center;
    }

    .cat-card .icon {
      font-size: 1.4rem;
    }

    .cat-card span {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 1px;
      color: #fff;
    }

    /* Стилі категорій під час вибору */
    .cat-card[data-cat="auto"].active, .cat-card[data-cat="auto"]:hover {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .cat-card[data-cat="moto"].active, .cat-card[data-cat="moto"]:hover {
      border-color: var(--neon-pink);
      box-shadow: 0 0 15px var(--neon-pink);
    }

    .cat-card[data-cat="pitbike"].active, .cat-card[data-cat="pitbike"]:hover {
      border-color: var(--neon-green);
      box-shadow: 0 0 15px var(--neon-green);
    }

    .cat-card[data-cat="scooter"].active, .cat-card[data-cat="scooter"]:hover {
      border-color: var(--neon-purple);
      box-shadow: 0 0 15px var(--neon-purple);
    }

    /* Сітка техніки */
    .vehicles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .v-card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      transition: all 0.35s ease;
      display: flex;
      flex-direction: column;
    }

    .v-card:hover {
      transform: translateY(-6px);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
    }

    .v-img-container {
      width: 100%;
      height: 180px;
      position: relative;
      background: #05070d;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .v-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .v-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .v-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .v-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .v-badge {
      font-size: 0.65rem;
      font-family: 'Orbitron', sans-serif;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid currentColor;
      text-transform: uppercase;
      font-weight: 700;
    }

    .badge-auto { color: var(--neon-cyan); border-color: var(--neon-cyan); box-shadow: 0 0 5px var(--neon-cyan); }
    .badge-moto { color: var(--neon-pink); border-color: var(--neon-pink); box-shadow: 0 0 5px var(--neon-pink); }
    .badge-pit { color: var(--neon-green); border-color: var(--neon-green); box-shadow: 0 0 5px var(--neon-green); }
    .badge-scooter { color: var(--neon-purple); border-color: var(--neon-purple); box-shadow: 0 0 5px var(--neon-purple); }

    .v-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 15px;
      color: var(--text-dim);
    }

    .v-price {
      color: var(--neon-green);
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      text-shadow: 0 0 5px var(--neon-green);
    }

    .btn-book {
      width: 100%;
      padding: 10px;
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid var(--neon-cyan);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.3s;
      margin-top: auto;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
    }

    .btn-book:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 20px var(--neon-cyan);
    }
  </style>
</head>
<body>

  <!-- Заголовок сайту -->
  <header>
    <div class="brand-title">CYBER MECHANICS HUB</div>
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" onkeyup="filterCards()" placeholder="FIND YOUR RIDE..." />
    </div>
  </header>

  <!-- Вкладки категорій -->
  <div class="categories-bar">
    <div class="cat-card active" data-cat="all" onclick="selectCat('all', this)">
      <span class="icon">⚡</span> <span>ALL</span>
    </div>
    <div class="cat-card" data-cat="auto" onclick="selectCat('auto', this)">
      <span class="icon">🏎️</span> <span>AUTOS</span>
    </div>
    <div class="cat-card" data-cat="moto" onclick="selectCat('moto', this)">
      <span class="icon">🏍️</span> <span>MOTOS</span>
    </div>
    <div class="cat-card" data-cat="pitbike" onclick="selectCat('pitbike', this)">
      <span class="icon">🏁</span> <span>PITBIKES</span>
    </div>
    <div class="cat-card" data-cat="scooter" onclick="selectCat('scooter', this)">
      <span class="icon">🛵</span> <span>SCOOTERS</span>
    </div>
  </div>

  <!-- Сітка карток -->
  <div class="vehicles-grid" id="grid">

    <!-- BMW M5 F90 -->
    <div class="v-card" data-category="auto" data-name="bmw m5 f90">
      <div class="v-img-container">
        <img src="https://images.unsplash.com/photo-1555215695-3004980ad54e?w=500" alt="BMW M5 F90">
      </div>
      <div class="v-content">
        <div class="v-header">
          <span class="v-title">BMW M5 F90</span>
          <span class="v-badge badge-auto">AUTO</span>
        </div>
        <div class="v-info">
          <span>Service: Engine Tuning</span>
          <span class="v-price">15000 UAH</span>
        </div>
        <button class="btn-book">BOOK APPOINTMENT</button>
      </div>
    </div>

    <!-- Audi R8 -->
    <div class="v-card" data-category="auto" data-name="audi r8">
      <div class="v-img-container">
        <img src="https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=500" alt="Audi R8">
      </div>
      <div class="v-content">
        <div class="v-header">
          <span class="v-title">Audi R8</span>
          <span class="v-badge badge-auto">AUTO</span>
        </div>
        <div class="v-info">
          <span>Service: Engine Tuning</span>
          <span class="v-price">15000 UAH</span>
        </div>
        <button class="btn-book">BOOK APPOINTMENT</button>
      </div>
    </div>

    <!-- Pitster Pro LXR -->
    <div class="v-card" data-category="pitbike" data-name="pitster pro lxr">
      <div class="v-img-container">
        <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=500" alt="Pitster Pro LXR">
      </div>
      <div class="v-content">
        <div class="v-header">
          <span class="v-title">Pitster Pro LXR</span>
          <span class="v-badge badge-pit">PITBIKE</span>
        </div>
        <div class="v-info">
          <span>Service: Suspension & Engine</span>
          <span class="v-price">1200 UAH</span>
        </div>
        <button class="btn-book">BOOK APPOINTMENT</button>
      </div>
    </div>

    <!-- Vespa / Scooter -->
    <div class="v-card" data-category="scooter" data-name="vespa scooter">
      <div class="v-img-container">
        <img src="https://images.unsplash.com/photo-1525160354320-d8e92641c563?w=500" alt="Vespa">
      </div>
      <div class="v-content">
        <div class="v-header">
          <span class="v-title">Vespa Custom</span>
          <span class="v-badge badge-scooter">SCOOTER</span>
        </div>
        <div class="v-info">
          <span>Service: Full Service</span>
          <span class="v-price">850 UAH</span>
        </div>
        <button class="btn-book">BOOK APPOINTMENT</button>
      </div>
    </div>

  </div>

  <script>
    let currentCategory = 'all';

    function selectCat(cat, element) {
      currentCategory = cat;
      document.querySelectorAll('.cat-card').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      filterCards();
    }

    function filterCards() {
      const searchValue = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.v-card');

      cards.forEach(card => {
        const name = card.getAttribute('data-name');
        const cat = card.getAttribute('data-category');

        const matchesSearch = name.includes(searchValue);
        const matchesCat = (currentCategory === 'all' || cat === currentCategory);

        if (matchesSearch && matchesCat) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
