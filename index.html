<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>😎 AUTO MECHANIC PRO</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080c;color:#fff;font-family:Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}

#menu{
 position:fixed;inset:0;z-index:10;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle,#20394d,#05080c 70%);
}
.box{
 width:min(460px,92%);
 padding:28px;
 border-radius:26px;
 background:rgba(8,13,19,.95);
 border:1px solid #405463;
 box-shadow:0 25px 100px #000;
 text-align:center
}
.logo{font-size:36px;font-weight:1000}
.logo span{color:#18d8ff}
.sub{color:#9facb7;line-height:1.5}
.start{
 width:100%;padding:16px;margin-top:15px;
 border:0;border-radius:15px;
 background:linear-gradient(135deg,#00d8ff,#236cff);
 color:white;font-weight:900;font-size:16px
}

#ui{display:none;position:fixed;inset:0;pointer-events:none}
.panel{
 background:rgba(5,10,15,.86);
 border:1px solid rgba(255,255,255,.13);
 backdrop-filter:blur(12px);
 border-radius:15px;
 padding:10px 13px
}
.top{
 position:absolute;top:10px;left:10px;right:10px;
 display:flex;justify-content:space-between
}
#job{
 position:absolute;top:70px;left:10px;
 width:min(370px,calc(100% - 20px))
}
#title{font-size:18px;font-weight:900}
#desc{font-size:12px;color:#aab6c0;margin-top:4px;line-height:1.4}

#tools{
 position:absolute;
 left:8px;right:8px;bottom:10px;
 display:flex;justify-content:center;
 flex-wrap:wrap;
 pointer-events:auto
}
button{
 padding:12px 14px;margin:4px;
 border-radius:13px;
 border:1px solid #415362;
 background:#12202c;
 color:white;
 font-weight:800
}
button:active{transform:scale(.95)}
.blue{background:#087db0}
.green{background:#07835e}
.orange{background:#a65f00}
.red{background:#a52d40}

#hint{
 position:absolute;
 left:50%;bottom:95px;
 transform:translateX(-50%);
 background:rgba(0,0,0,.9);
 padding:10px 15px;
 border-radius:12px;
 opacity:0;
 transition:.2s;
 white-space:nowrap
}
#hint.show{opacity:1}

#finish{
 display:none;
 position:fixed;inset:0;z-index:20;
 background:rgba(0,0,0,.8);
 align-items:center;justify-content:center
}
.finish{
 width:min(430px,90%);
 padding:28px;
 text-align:center;
 border-radius:25px;
 background:#0a1118;
 border:1px solid #405363
}
.cash{font-size:52px;font-weight:1000;color:#49f0a5}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
 <div class="box">
  <div class="logo">AUTO<span>MECHANIC</span> 😎</div>
  <p class="sub">
   Твоя власна автомайстерня.<br>
   Клієнти приїжджають на різних машинах.
   Шукай поломки сам, ремонтуй деталі та заробляй гроші.
  </p>
  <button class="start" onclick="startGame()">
   🚗 ПОЧАТИ РОБОТУ
  </button>
 </div>
</div>

<div id="ui">

 <div class="top">
  <div class="panel">
   🔧 AUTO MECHANIC
   <br>
   <small id="phase">Майстерня</small>
  </div>

  <div class="panel">
   💰 $<span id="money">1000</span>
  </div>
 </div>

 <div id="job" class="panel">
  <div id="title">Очікування клієнта</div>
  <div id="desc">Нова машина скоро заїде.</div>
 </div>

 <div id="hint"></div>

 <div id="tools"></div>

</div>

<div id="finish">
 <div class="finish">
  <h2>🔥 РЕМОНТ ЗАВЕРШЕНО</h2>
  <div class="cash">+$420</div>
  <p>Клієнт задоволений. Ти заробив гроші.</p>
  <button class="start" onclick="newCar()">
   🚗 НАСТУПНИЙ КЛІЄНТ
  </button>
 </div>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight;
let DPR=devicePixelRatio||1;

function resize(){
 W=innerWidth;
 H=innerHeight;
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

let playing=false;
let carX=-350;
let arrived=false;
let phaseNow=0;

let cash=1000;

let hood=false;
let wheel=false;
let brake=false;
let oil=false;
let battery=false;
let tire=false;
let light=false;
let coolant=false;

let carType=0;
let carColor="#d91f35";
let carName="SPORT";

const colors=[
 "#d91f35",
 "#1976d2",
 "#16a56a",
 "#f0a51b",
 "#7d46d8",
 "#e6e6e6",
 "#252b31"
];

const names=[
 "SPORT",
 "SEDAN",
 "RACER",
 "COUPE",
 "GT",
 "PREMIUM",
 "TURBO"
];

function randomCar(){

 carType=
 Math.floor(Math.random()*7);

 carColor=
 colors[Math.floor(Math.random()*colors.length)];

 carName=
 names[Math.floor(Math.random()*names.length)];

 hood=false;
 wheel=false;
 brake=false;
 oil=false;
 battery=false;
 tire=false;
 light=false;
 coolant=false;
}

function startGame(){

 document.getElementById("menu").style.display="none";
 document.getElementById("ui").style.display="block";

 randomCar();

 playing=true;
 arrived=false;
 carX=-350;

 setJob(
  "КЛІЄНТ ЇДЕ",
  carName+" заїжджає у твою майстерню. Підготуй пост."
 );

 setPhase("Заїзд автомобіля");

 buttons("");

 loop();
}

function newCar(){

 document.getElementById("finish").style.display="none";

 randomCar();

 arrived=false;
 carX=-350;

 setPhase("Новий клієнт");

 setJob(
  "НОВА МАШИНА",
  "Цього разу автомобіль інший. Сам знайди його проблеми."
 );

 buttons("");

}

function setPhase(t){
 document.getElementById("phase").textContent=t;
}

function setJob(t,d){
 document.getElementById("title").textContent=t;
 document.getElementById("desc").textContent=d;
}

function buttons(html){
 document.getElementById("tools").innerHTML=html;
}

function hint(t){

 const h=document.getElementById("hint");

 h.textContent=t;
 h.classList.add("show");

 clearTimeout(h.timer);

 h.timer=setTimeout(
  ()=>h.classList.remove("show"),
  1800
 );
}

function addMoney(n){

 cash+=n;

 document.getElementById("money").textContent=cash;
}

function garage(){

 let g=ctx.createLinearGradient(0,0,0,H);

 g.addColorStop(0,"#172939");
 g.addColorStop(.55,"#0c131a");
 g.addColorStop(1,"#030507");

 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 // стіни

 ctx.fillStyle="#111b24";
 ctx.fillRect(0,0,W,H*.57);

 // металеві панелі

 for(let x=0;x<W;x+=80){

  ctx.strokeStyle="rgba(255,255,255,.035)";
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,H*.57);
  ctx.stroke();
 }

 // ворота

 ctx.fillStyle="#06090d";
 ctx.fillRect(
  W*.08,H*.12,
  W*.84,H*.44
 );

 ctx.strokeStyle="#344957";
 ctx.lineWidth=5;
 ctx.strokeRect(
  W*.08,H*.12,
  W*.84,H*.44
 );
 ctx.lineWidth=1;

 // лампи

 for(let x=W*.2;x<W*.9;x+=W*.22){

  ctx.fillStyle="#bff7ff";
  ctx.shadowBlur=25;
  ctx.shadowColor="#43dfff";

  ctx.fillRect(
   x,H*.045,
   75,7
  );

  ctx.shadowBlur=0;
 }

 // підлога

 ctx.fillStyle="#151c21";

 ctx.beginPath();

 ctx.moveTo(0,H*.57);
 ctx.lineTo(W,H*.57);
 ctx.lineTo(W,H);
 ctx.lineTo(0,H);

 ctx.fill();

 // плитка

 ctx.strokeStyle="rgba(255,255,255,.045)";

 for(let y=H*.57;y<H;y+=50){

  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(W,y);
  ctx.stroke();
 }

 for(let x=0;x<W;x+=70){

  ctx.beginPath();
  ctx.moveTo(x,H*.57);
  ctx.lineTo(
   W/2+(x-W/2)*1.7,
   H
  );
  ctx.stroke();
 }

 // підйомник

 ctx.fillStyle="#303a42";

 ctx.fillRect(
  W/2-260,
  H*.72,
  520,
  18
 );

 ctx.fillStyle="#e0a51d";

 ctx.fillRect(
  W/2-255,
  H*.73,
  12,
  130
 );

 ctx.fillRect(
  W/2+243,
  H*.73,
  12,
  130
 );

 // шафи

 ctx.fillStyle="#202b34";

 ctx.fillRect(
  25,H*.35,
  125,170
 );

 ctx.fillStyle="#27343e";

 for(let y=H*.38;y<H*.65;y+=35){

  ctx.fillRect(
   35,y,
   105,23
  );
 }
}

function rounded(x,y,w,h,r){

 ctx.beginPath();

 ctx.roundRect(
  x,y,w,h,r
 );

 ctx.fill();
}

function wheelDraw(x,y,removed){

 if(removed)return;

 ctx.save();

 ctx.translate(x,y);

 ctx.fillStyle="#080a0d";

 ctx.beginPath();
 ctx.arc(0,0,43,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#858d93";

 ctx.beginPath();
 ctx.arc(0,0,27,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#20262b";

 ctx.beginPath();
 ctx.arc(0,0,10,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#d8dce0";
 ctx.lineWidth=4;

 for(let i=0;i<6;i++){

  let a=i*Math.PI/3;

  ctx.beginPath();

  ctx.moveTo(
   Math.cos(a)*9,
   Math.sin(a)*9
  );

  ctx.lineTo(
   Math.cos(a)*24,
   Math.sin(a)*24
  );

  ctx.stroke();
 }

 ctx.restore();
}

function drawCar(){

 const cx=carX;
 const cy=H*.66;

 ctx.save();
 ctx.translate(cx,cy);

 // тінь

 ctx.fillStyle="rgba(0,0,0,.55)";

 ctx.beginPath();

 ctx.ellipse(
  0,115,205,28,0,0,Math.PI*2
 );

 ctx.fill();

 // колеса

 wheelDraw(-145,65,wheel);
 wheelDraw(145,65,false);

 // кузов

 let body=ctx.createLinearGradient(
  0,-80,0,70
 );

 body.addColorStop(0,carColor);
 body.addColorStop(.5,carColor);
 body.addColorStop(1,"#42070d");

 ctx.fillStyle=body;

 rounded(
  -195,-35,
  390,105,
  25
 );

 // капот

 ctx.fillStyle=carColor;

 rounded(
  -145,-78,
  290,60,
  18
 );

 // дах

 ctx.beginPath();

 ctx.moveTo(-120,-78);
 ctx.lineTo(-70,-145);
 ctx.lineTo(75,-145);
 ctx.lineTo(125,-78);
 ctx.closePath();

 ctx.fill();

 // скло

 ctx.fillStyle="#0b202d";

 ctx.beginPath();

 ctx.moveTo(-96,-82);
 ctx.lineTo(-58,-130);
 ctx.lineTo(-8,-130);
 ctx.lineTo(-8,-82);
 ctx.closePath();

 ctx.fill();

 ctx.beginPath();

 ctx.moveTo(5,-130);
 ctx.lineTo(63,-130);
 ctx.lineTo(101,-82);
 ctx.lineTo(5,-82);
 ctx.closePath();

 ctx.fill();

 // фари

 ctx.fillStyle=
 light
 ?"white"
 :"#ffe98c";

 ctx.shadowBlur=20;
 ctx.shadowColor="#ffe45e";

 rounded(-180,-25,43,20,7);
 rounded(137,-25,43,20,7);

 ctx.shadowBlur=0;

 // решітка

 ctx.fillStyle="#0a1015";

 rounded(-60,25,120,25,7);

 // двері

 ctx.strokeStyle="rgba(255,255,255,.22)";

 ctx.beginPath();
 ctx.moveTo(-5,-70);
 ctx.lineTo(-5,55);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(-150,-5);
 ctx.lineTo(-40,-5);
 ctx.stroke();

 // ручки

 ctx.fillStyle="#d9d9d9";

 ctx.fillRect(
  -25,-2,
  35,5
 );

 // номер

 ctx.fillStyle="#e8edf0";

 rounded(-55,55,110,20,4);

 ctx.fillStyle="#111";

 ctx.font="bold 11px Arial";
 ctx.textAlign="center";

 ctx.fillText(
  "AUTO-"+(100+carType*37),
  0,69
 );

 // капот відкритий

 if(hood){

  ctx.fillStyle="#161d23";

  ctx.strokeStyle="#ef3448";

  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(-145,-78);
  ctx.lineTo(-110,-150);
  ctx.lineTo(110,-150);
  ctx.lineTo(145,-78);
  ctx.closePath();

  ctx.fill();
  ctx.stroke();

  ctx.lineWidth=1;

  // двигун

  ctx.fillStyle="#414b52";

  rounded(-70,-125,140,55,10);

  for(let x=-45;x<60;x+=25){

   ctx.fillStyle="#68747a";

   ctx.fillRect(
    x,-116,13,36
   );
  }

  // акумулятор

  ctx.fillStyle=
  battery
  ?"#38df91"
  :"#15191c";

  rounded(-115,-122,48,35,5);

  ctx.fillStyle="#e33";

  ctx.beginPath();

  ctx.arc(
   -102,-117,
   6,0,Math.PI*2
  );

  ctx.fill();
 }

 // підняте авто

 if(phaseNow>=2 && phaseNow<7){

  ctx.fillStyle="#e3aa21";

  ctx.fillRect(
   -255,98,
   510,8
  );
 }

 ctx.restore();
}

function repairStage(){

 if(phaseNow===1){

  setJob(
   "ДІАГНОСТИКА",
   "Торкнися частин машини: капота, колеса, фари або кузова. Шукай проблему."
  );

  buttons(`
   <button class="blue" onclick="openHood()">
    🔓 ВІДКРИТИ КАПОТ
   </button>

   <button class="orange" onclick="raiseLift()">
    ⬆️ ПІДНЯТИ АВТО
   </button>
  `);
 }
}

function openHood(){

 hood=true;

 phaseNow=1;

 setPhase("Огляд двигуна");

 setJob(
  "ПІД КАПОТОМ",
  "Оглянь двигун та акумулятор. Якщо знайшов проблему — ремонтуй."
 );

 buttons(`
  <button class="blue" onclick="fixBattery()">
   🔋 ПЕРЕВІРИТИ АКУМУЛЯТОР
  </button>

  <button class="orange" onclick="changeOil()">
   🛢️ ПЕРЕВІРИТИ МАСЛО
  </button>

  <button onclick="closeHood()">
   🔒 ЗАКРИТИ КАПОТ
  </button>
 `);
}

function closeHood(){

 hood=false;

 setJob(
  "ОГЛЯД",
  "Тепер оглянь колеса та кузов."
 );

 buttons(`
  <button class="orange" onclick="raiseLift()">
   ⬆️ ПІДНЯТИ АВТО
  </button>
 `);
}

function raiseLift(){

 phaseNow=2;

 setPhase("Підйомник");

 setJob(
  "АВТО ПІДНЯТО",
  "Тепер можна самому працювати з колесами."
 );

 buttons(`
  <button class="blue" onclick="removeWheel()">
   🔩 ВІДКРУТИТИ КОЛЕСО
  </button>

  <button class="orange" onclick="checkBrake()">
   🛑 ОГЛЯНУТИ ГАЛЬМА
  </button>
 `);
}

function removeWheel(){

 wheel=true;

 phaseNow=3;

 setPhase("Колесо знято");

 setJob(
  "ПЕРЕДНЄ КОЛЕСО",
  "Колесо знято. Оглянь гальмівний диск та шину."
 );

 buttons(`
  <button class="red" onclick="fixBrake()">
   🛑 ЗАМІНИТИ ГАЛЬМІВНИЙ ДИСК
  </button>

  <button class="orange" onclick="fixTire()">
   🛞 ПЕРЕВІРИТИ ШИНУ
  </button>
 `);
}

function checkBrake(){

 hint(
  "🔴 Гальмівний диск зношений!"
 );

 setTimeout(
  fixBrake,
  700
 );
}

function fixBrake(){

 brake=true;

 setJob(
  "ГАЛЬМА",
  "Новий гальмівний диск встановлено. Постав колесо назад."
 );

 buttons(`
  <button class="green" onclick="installWheel()">
   🛞 ПОСТАВИТИ КОЛЕСО
  </button>
 `);

 hint(
  "🔧 Гальмо відремонтовано!"
 );
}

function fixTire(){

 tire=true;

 hint(
  "🛞 Шину відремонтовано!"
 );

 if(brake)
  installWheel();
}

function installWheel(){

 wheel=false;

 phaseNow=4;

 setJob(
  "КОЛЕСО ГОТОВЕ",
  "Тепер перевір масло та електрику."
 );

 buttons(`
  <button class="orange" onclick="changeOil()">
   🛢️ ЗАМІНИТИ МАСЛО
  </button>

  <button class="blue" onclick="fixBattery()">
   🔋 АКУМУЛЯТОР
  </button>
 `);
}

function changeOil(){

 oil=true;

 setJob(
  "МАСЛО",
  "Старе масло злито. Залий свіже."
 );

 buttons(`
  <button class="green" onclick="fillOil()">
   🛢️ ЗАЛИТИ НОВЕ МАСЛО
  </button>
 `);
}

function fillOil(){

 oil=true;

 hint(
  "🛢️ Нове масло залито!"
 );

 buttons(`
  <button class="blue" onclick="fixBattery()">
   🔋 ПЕРЕВІРИТИ АКУМУЛЯТОР
  </button>
 `);
}

function fixBattery(){

 battery=true;

 hint(
  "⚡ Клеми акумулятора справні!"
 );

 setJob(
  "ЕЛЕКТРИКА",
  "Акумулятор готовий. Зроби фінальну перевірку."
 );

 buttons(`
  <button class="green" onclick="finishCheck()">
   🚗 ФІНАЛЬНА ПЕРЕВІРКА
  </button>
 `);
}

function finishCheck(){

 phaseNow=7;

 setPhase("Фінальна перевірка");

 setJob(
  "ЗАПУСК ДВИГУНА",
  "Усі основні роботи виконані. Запускай двигун."
 );

 buttons(`
  <button class="green" onclick="testDrive()">
   🚗 ЗАПУСТИТИ ДВИГУН
  </button>
 `);
}

function testDrive(){

 setJob(
  "ТЕСТ-ДРАЙВ",
  "Двигун працює. Перевіряю автомобіль..."
 );

 buttons("");

 hint(
  "🔥 ВСІ СИСТЕМИ ПРАЦЮЮТЬ"
 );

 setTimeout(()=>{

  addMoney(420);

  document.getElementById(
   "finish"
  ).style.display="flex";

 },2500);
}

/* КЕРУВАННЯ ПАЛЬЦЕМ */

let drag=false;
let lastX=0;

canvas.addEventListener(
 "pointerdown",
 e=>{
  drag=true;
  lastX=e.clientX;
 }
);

canvas.addEventListener(
 "pointermove",
 e=>{

  if(!drag)return;

  let dx=e.clientX-lastX;

  lastX=e.clientX;

  if(arrived){

   carX += dx*.15;

   carX=Math.max(
    W/2-100,
    Math.min(W/2+100,carX)
   );
  }
 }
);

canvas.addEventListener(
 "pointerup",
 ()=>drag=false
);

canvas.addEventListener(
 "pointercancel",
 ()=>drag=false
);

/* ТОРКАННЯ ПО МАШИНІ */

canvas.addEventListener(
 "pointerup",
 e=>{

  if(!arrived)return;

  const x=e.clientX;
  const y=e.clientY;

  const cx=carX;
  const cy=H*.66;

  const dx=x-cx;
  const dy=y-cy;

  // капот

  if(
   dx>-160 &&
   dx<160 &&
   dy>-180 &&
   dy<-65
  ){

   openHood();
   return;
  }

  // ліве колесо

  if(
   Math.abs(dx+145)<55 &&
   Math.abs(dy-65)<55
  ){

   if(phaseNow>=2){

    removeWheel();

   }else{

    hint(
     "🔧 Спочатку підніми автомобіль"
    );
   }

   return;
  }

  // фара

  if(
   Math.abs(dx)>130 &&
   Math.abs(dy+15)<35
  ){

   light=true;

   hint(
    "💡 Фара перевірена"
   );

   return;
  }

  hint(
   "🔍 Тут усе виглядає нормально"
  );
});

function draw(){

 garage();

 if(playing){

  if(!arrived){

   carX+=3;

   if(carX>=W/2){

    carX=W/2;
    arrived=true;
    phaseNow=1;

    setPhase("Приймання автомобіля");

    setJob(
     "🚗 МАШИНА ПРИЇХАЛА",
     "Тепер ти сам оглядаєш автомобіль. Торкайся деталей."
    );

    repairStage();
   }
  }

  drawCar();
 }

 requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
