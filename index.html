<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBER MECHANICS HUB</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070a12;
      --card-bg: #0d1222;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-green: #00ff66;
      --neon-purple: #ab00ff;
      --text-main: #ffffff;
      --text-dim: #8a99ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.12) 0%, transparent 70%),
        linear-gradient(rgba(0, 243, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-main);
      padding: 20px 15px;
      min-height: 100vh;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 25px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      border-bottom: 2px solid rgba(0, 243, 255, 0.2);
      padding-bottom: 15px;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--neon-cyan);
      text-shadow: 0 0 12px var(--neon-cyan);
      letter-spacing: 2px;
    }

    .search-input {
      background: rgba(13, 18, 34, 0.9);
      border: 1px solid var(--neon-cyan);
      border-radius: 6px;
      padding: 10px 15px;
      color: var(--neon-cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      outline: none;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
      width: 260px;
    }

    /* Категорії */
    .categories-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      max-width: 1200px;
      margin: 0 auto 30px auto;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid rgba(0, 243, 255, 0.3);
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    /* Сітка карт */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
    }

    .card-img-wrap {
      width: 100%;
      height: 180px;
      position: relative;
      background: #000;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    .badge-auto { background: rgba(255, 0, 85, 0.9); color: #fff; box-shadow: 0 0 8px var(--neon-pink); }
    .badge-moto { background: rgba(171, 0, 255, 0.9); color: #fff; box-shadow: 0 0 8px var(--neon-purple); }
    .badge-pit { background: rgba(0, 255, 102, 0.9); color: #000; box-shadow: 0 0 8px var(--neon-green); }
    .badge-scooter { background: rgba(0, 243, 255, 0.9); color: #000; box-shadow: 0 0 8px var(--neon-cyan); }

    .card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: #fff;
    }

    .card-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 12px;
      border-radius: 5px;
      border-left: 3px solid var(--neon-cyan);
    }

    .service-desc {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .price {
      font-family: 'Orbitron', sans-serif;
      color: var(--neon-green);
      font-weight: 800;
      font-size: 0.95rem;
    }

    .btn-book {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 800;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: auto;
      letter-spacing: 1px;
    }

    .btn-book:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    /* Модальне вікно */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .modal-box {
      background: var(--card-bg);
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
      padding: 30px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      color: var(--neon-cyan);
      margin-bottom: 15px;
      font-size: 1.1rem;
      text-align: center;
    }

    .modal-input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background: #04060a;
      border: 1px solid rgba(0, 243, 255, 0.4);
      color: #fff;
      border-radius: 5px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-submit {
      flex: 2;
      background: var(--neon-cyan);
      border: none;
      color: #000;
      padding: 10px;
      font-family: 'Orbitron', sans-serif;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 800;
    }

    .btn-cancel {
      flex: 1;
      background: transparent;
      border: 1px solid var(--neon-pink);
      color: var(--neon-pink);
      padding: 10px;
      font-family: 'Orbitron', sans-serif;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">CYBER MECHANICS</div>
    <input type="text" id="searchInput" class="search-input" onkeyup="filterCards()" placeholder="SEARCH VEHICLE..." />
  </header>

  <div class="categories-bar">
    <button class="cat-btn active" onclick="selectCat('all', this)">ALL</button>
    <button class="cat-btn" onclick="selectCat('auto', this)">AUTO</button>
    <button class="cat-btn" onclick="selectCat('moto', this)">MOTO</button>
    <button class="cat-btn" onclick="selectCat('pitbike', this)">PITBIKE</button>
    <button class="cat-btn" onclick="selectCat('scooter', this)">SCOOTER</button>
  </div>

  <div class="grid" id="grid">

    <!-- Kawasaki Z900 -->
    <div class="card" data-cat="moto" data-name="kawasaki z900">
      <div class="card-img-wrap">
        <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=600&q=80" 
             onerror="this.src='https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&w=600&q=80'" 
             class="card-img" alt="Kawasaki Z900" />
        <span class="badge badge-moto">MOTO</span>
      </div>
      <div class="card-body">
        <div class="card-title">Kawasaki Z900</div>
        <div class="card-info">
          <span class="service-desc">Chain & Brakes Service</span>
          <span class="price">2200 UAH</span>
        </div>
        <button class="btn-book" onclick="openBooking('Kawasaki Z900')">BOOK APPOINTMENT</button>
      </div>
    </div>

    <!-- Pitster Pro LXR -->
    <div class="card" data-cat="pitbike" data-name="pitster pro lxr">
      <div class="card-img-wrap">
        <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80" 
             onerror="this.src='https://images.unsplash.com/photo-1547549662-77849a0d8421?auto=format&fit=crop&w=600&q=80'" 
             class="card-img" alt="Pitster Pro LXR" />
        <span class="badge badge-pit">PITBIKE</span>
      </div>
      <div class="card-body">
        <div class="card-title">Pitster Pro LXR</div>
        <div class="card-info">
          <span class="service-desc">Suspension & Engine</span>
          <span class="price">1200 UAH</span>
        </div>
        <button class="btn-book" onclick="openBooking('Pitster Pro LXR')">BOOK APPOINTMENT</button>
      </div>
    </div>

    <!-- Kayo Pitbike -->
    <div class="card" data-cat="pitbike" data-name="kayo pitbike">
      <div class="card-img-wrap">
        <img src="https://images.unsplash.com/photo-1547549662-77849a0d8421?auto=format&fit=crop&w=600&q=80" 
             onerror="this.src='https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80'" 
             class="card-img" alt="Kayo Pitbike" />
        <span class="badge badge-pit">PITBIKE</span>
      </div>
      <div class="card-body">
        <div class="card-title">Kayo Pitbike</div>
        <div class="card-info">
          <span class="service-desc">Carburetor & Valves</span>
          <span class="price">950 UAH</span>
        </div>
        <button class="btn-book" onclick="openBooking('Kayo Pitbike')">BOOK APPOINTMENT</button>
      </div>
    </div>

    <!-- Vespa Custom -->
    <div class="card" data-cat="scooter" data-name="vespa custom">
      <div class="card-img-wrap">
        <img src="https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?auto=format&fit=crop&w=600&q=80" 
             onerror="this.src='https://images.unsplash.com/photo-1525160354320-d8e92641c563?auto=format&fit=crop&w=600&q=80'" 
             class="card-img" alt="Vespa Custom" />
        <span class="badge badge-scooter">SCOOTER</span>
      </div>
      <div class="card-body">
        <div class="card-title">Vespa Custom</div>
        <div class="card-info">
          <span class="service-desc">Full Maintenance</span>
          <span class="price">850 UAH</span>
        </div>
        <button class="btn-book" onclick="openBooking('Vespa Custom')">BOOK APPOINTMENT</button>
      </div>
    </div>

    <!-- Honda Scooter / Dio -->
    <div class="card" data-cat="scooter" data-name="honda dio 35 zx">
      <div class="card-img-wrap">
        <img src="https://images.unsplash.com/photo-1525160354320-d8e92641c563?auto=format&fit=crop&w=600&q=80" 
             onerror="this.src='https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?auto=format&fit=crop&w=600&q=80'" 
             class="card-img" alt="Honda Dio 35 ZX" />
        <span class="badge badge-scooter">SCOOTER</span>
      </div>
      <div class="card-body">
        <div class="card-title">Honda Dio 35 ZX</div>
        <div class="card-info">
          <span class="service-desc">Variator & Engine Tuning</span>
          <span class="price">700 UAH</span>
        </div>
        <button class="btn-book" onclick="openBooking('Honda Dio 35 ZX')">BOOK APPOINTMENT</button>
      </div>
    </div>

  </div>

  <!-- Модальне вікно -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">BOOK APPOINTMENT</div>
      <input type="text" class="modal-input" placeholder="Ваше ім'я" />
      <input type="tel" class="modal-input" placeholder="Номер телефону" />
      <input type="date" class="modal-input" />
      <div class="modal-actions">
        <button class="btn-submit" onclick="closeBooking(true)">ПІДТВЕРДИТИ</button>
        <button class="btn-cancel" onclick="closeBooking(false)">СКАСУВАТИ</button>
      </div>
    </div>
  </div>

  <script>
    let currentCategory = 'all';

    function selectCat(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCards();
    }

    function filterCards() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.card');

      cards.forEach(card => {
        const name = card.getAttribute('data-name');
        const cat = card.getAttribute('data-cat');
        const matchSearch = name.includes(search);
        const matchCat = (currentCategory === 'all' || cat === currentCategory);

        if (matchSearch && matchCat) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function openBooking(title) {
      document.getElementById('modalTitle').innerText = 'ЗАПИС: ' + title;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeBooking(submitted) {
      document.getElementById('modal').style.display = 'none';
      if (submitted) {
        alert('Заявку відправлено!');
      }
    }
  </script>
</body>
</html>
