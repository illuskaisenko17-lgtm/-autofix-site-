<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>3D Garage Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; color: #fff; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: #ff9900; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        #instructions { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; border: 1px solid #ff9900; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="instructions">
        <h2>🏎️ Автогараж 3D</h2>
        <p><strong>Клікни по екрану, щоб почати!</strong></p>
        <p>🎮 <strong>W, A, S, D</strong> — Ходити</p>
        <p>🖱️ <strong>Мишка</strong> — Оглядатися</p>
        <p>🚀 <strong>Пробіл</strong> — Стрибок</p>
        <p>🔴 <strong>Esc</strong> — Вийти з режиму огляду</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Освітлення всередині гаража
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const garageLight = new THREE.PointLight(0xffaa00, 2, 30);
        garageLight.position.set(0, 7, 0);
        scene.add(garageLight);

        // Стіни, підлога та стеля гаража
        const wallMat = new THREE.MeshPhongMaterial({ color: 0x333333, side: THREE.DoubleSide });
        const floorMat = new THREE.MeshPhongMaterial({ color: 0x222222, side: THREE.DoubleSide });

        // Підлога
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), floorMat);
        floor.rotation.x = Math.PI / 2;
        scene.add(floor);

        // Стіни
        const wallBack = new THREE.Mesh(new THREE.PlaneGeometry(20, 8), wallMat);
        wallBack.position.set(0, 4, -10);
        scene.add(wallBack);

        const wallLeft = new THREE.Mesh(new THREE.PlaneGeometry(20, 8), wallMat);
        wallLeft.rotation.y = Math.PI / 2;
        wallLeft.position.set(-10, 4, 0);
        scene.add(wallLeft);

        const wallRight = new THREE.Mesh(new THREE.PlaneGeometry(20, 8), wallMat);
        wallRight.rotation.y = -Math.PI / 2;
        wallRight.position.set(10, 4, 0);
        scene.add(wallRight);

        // Автомобіль
        const carGroup = new THREE.Group();
        const carMat = new THREE.MeshPhongMaterial({ color: 0xcc0000, shininess: 90 });
        
        const carBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.7, 4.5), carMat);
        carBody.position.y = 0.6;
        carGroup.add(carBody);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2.2), carMat);
        cabin.position.set(0, 1.25, -0.2);
        carGroup.add(cabin);

        // Колеса
        const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.3, 16);
        const wheelMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
        const positions = [[-1.2, 0.45, 1.3], [1.2, 0.45, 1.3], [-1.2, 0.45, -1.3], [1.2, 0.45, -1.3]];
        positions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(...pos);
            carGroup.add(wheel);
        });

        carGroup.position.set(0, 0, 0);
        scene.add(carGroup);

        // Керування
        const controls = new THREE.PointerLockControls(camera, document.body);
        const instructions = document.getElementById('instructions');

        document.body.addEventListener('click', () => { controls.lock(); });
        controls.addEventListener('lock', () => { instructions.style.display = 'none'; });
        controls.addEventListener('unlock', () => { instructions.style.display = 'block'; });

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let prevTime = performance.now();

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump) velocity.y += 8; canJump = false; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        camera.position.set(0, 1.6, 6);

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            if (controls.isLocked) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 2.5 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 35.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 35.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                controls.getObject().position.y += (velocity.y * delta);

                if (controls.getObject().position.y < 1.6) {
                    velocity.y = 0;
                    controls.getObject().position.y = 1.6;
                    canJump = true;
                }
            }
            prevTime = time;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
