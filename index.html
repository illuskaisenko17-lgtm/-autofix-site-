<html lang="uk">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GidHot — Vehicle Catalog</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#05060b;
    --bg2:#0b0e16;
    --card:#10141f;
    --card2:#151a27;
    --pink:#ff176b;
    --pink2:#ff4d91;
    --orange:#ff6b35;
    --cyan:#00e5ff;
    --green:#00ffae;
    --yellow:#ffd84d;
    --text:#fff;
    --muted:#8d96aa;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 10% 0%,#ff176b25,transparent 28%),
        radial-gradient(circle at 90% 20%,#00e5ff12,transparent 25%),
        radial-gradient(circle at 50% 100%,#ff6b3510,transparent 30%),
        var(--bg);
    min-height:100vh;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#05060bee;
    backdrop-filter:blur(18px);
    border-bottom:1px solid #ff176b45;
}

.header{
    width:92%;
    max-width:1450px;
    margin:auto;
    min-height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:36px;
    font-weight:1000;
    letter-spacing:-2px;
}

.logo span{
    color:var(--pink);
    text-shadow:
        0 0 8px var(--pink),
        0 0 25px var(--pink),
        0 0 55px #ff176b88;
}

.header-buttons{
    display:flex;
    gap:10px;
}

.header-button{
    width:48px;
    height:48px;
    border-radius:14px;
    border:1px solid #ff176b55;
    background:#10141e;
    color:#fff;
    cursor:pointer;
    font-size:21px;
    transition:.25s;
}

.header-button:hover{
    border-color:var(--pink);
    box-shadow:0 0 25px #ff176b66;
    transform:translateY(-2px);
}

/* ================= MAIN ================= */

.container{
    width:92%;
    max-width:1450px;
    margin:0 auto;
}

.hero{
    text-align:center;
    padding:65px 10px 35px;
}

.hero h1{
    font-size:clamp(42px,7vw,78px);
    font-weight:1000;
    line-height:1;
}

.neon{
    color:var(--pink);
    text-shadow:
        0 0 5px var(--pink),
        0 0 20px var(--pink),
        0 0 50px var(--pink);
}

.hero p{
    max-width:800px;
    margin:22px auto;
    color:var(--muted);
    font-size:17px;
    line-height:1.6;
}

/* ================= SEARCH ================= */

.search{
    max-width:700px;
    margin:25px auto 0;
    display:flex;
    border:1px solid #ff176b66;
    border-radius:17px;
    overflow:hidden;
    background:#0d111a;
    box-shadow:0 0 25px #ff176b15;
}

.search input{
    flex:1;
    border:0;
    outline:0;
    padding:18px 20px;
    background:transparent;
    color:white;
    font-size:16px;
}

.search button{
    width:60px;
    border:0;
    background:var(--pink);
    color:#fff;
    font-size:21px;
}

/* ================= CATEGORIES ================= */

.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:18px 0 25px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex-shrink:0;
    border:1px solid #ff176b55;
    background:#10141f;
    color:#fff;
    padding:13px 20px;
    border-radius:14px;
    cursor:pointer;
    transition:.25s;
}

.category:hover,
.category.active{
    background:var(--pink);
    border-color:var(--pink);
    box-shadow:
        0 0 15px #ff176b77,
        0 0 35px #ff176b22;
}

/* ================= SECTION ================= */

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:25px 0 20px;
}

.section-header h2{
    font-size:30px;
}

.counter{
    color:var(--muted);
}

/* ================= CARDS ================= */

.catalog{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(310px,1fr));
    gap:24px;
}

.card{
    position:relative;
    overflow:hidden;
    border-radius:25px;
    background:
        linear-gradient(145deg,#121724,#080b12);
    border:1px solid #ff176b3d;
    transition:.3s;
}

.card:hover{
    transform:translateY(-7px);
    border-color:#ff176b;
    box-shadow:
        0 0 20px #ff176b55,
        0 0 65px #ff176b18;
}

.image-wrap{
    height:235px;
    position:relative;
    overflow:hidden;
    background:#090c13;
}

.image-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.5s;
}

.card:hover .image-wrap img{
    transform:scale(1.07);
}

.type-badge{
    position:absolute;
    left:15px;
    top:15px;
    padding:8px 13px;
    border-radius:12px;
    background:#05070ddd;
    backdrop-filter:blur(10px);
    border:1px solid #ffffff25;
    font-size:13px;
}

.favorite{
    position:absolute;
    right:15px;
    top:15px;
    width:43px;
    height:43px;
    border-radius:50%;
    background:#05070ddd;
    border:1px solid #ffffff30;
    color:#fff;
    cursor:pointer;
    font-size:19px;
}

.favorite.active{
    color:var(--pink);
    border-color:var(--pink);
    box-shadow:0 0 20px #ff176b88;
}

.card-content{
    padding:21px;
}

.brand{
    color:var(--pink2);
    font-size:12px;
    font-weight:bold;
    letter-spacing:2px;
}

.card h3{
    font-size:25px;
    margin:7px 0 17px;
}

.specs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.spec{
    padding:12px;
    background:var(--card2);
    border:1px solid #ffffff08;
    border-radius:12px;
}

.spec span{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-bottom:6px;
}

.spec strong{
    font-size:14px;
}

.card-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:18px;
}

.price{
    font-size:19px;
    font-weight:bold;
}

.details-button{
    padding:12px 17px;
    border:0;
    border-radius:12px;
    background:
        linear-gradient(90deg,var(--pink),var(--orange));
    color:white;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 20px #ff176b33;
}

/* ================= COMPARE ================= */

.compare{
    margin-top:80px;
    padding:32px;
    border-radius:28px;
    border:1px solid #ff176b55;
    background:
        radial-gradient(circle at 50% 0%,#ff176b18,transparent 45%),
        #0b0f18;
    box-shadow:0 0 50px #ff176b12;
}

.compare-head{
    text-align:center;
    margin-bottom:28px;
}

.compare-head h2{
    font-size:38px;
}

.compare-head p{
    color:var(--muted);
    margin-top:8px;
}

.compare-selects{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.select-box label{
    display:block;
    color:var(--muted);
    margin-bottom:8px;
}

select{
    width:100%;
    padding:16px;
    border-radius:14px;
    background:#141925;
    border:1px solid #ff176b55;
    color:white;
    outline:none;
    font-size:16px;
}

.compare-button{
    width:100%;
    margin-top:18px;
    padding:17px;
    border:0;
    border-radius:15px;
    background:
        linear-gradient(90deg,var(--pink),var(--orange));
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 30px #ff176b44;
}

/* ================= COMPARE RESULT ================= */

.result{
    margin-top:30px;
    overflow-x:auto;
}

.compare-table{
    width:100%;
    border-collapse:collapse;
    min-width:750px;
}

.compare-table th,
.compare-table td{
    padding:16px;
    border-bottom:1px solid #ff176b2d;
    text-align:center;
}

.compare-table th{
    color:var(--pink2);
    font-size:16px;
}

.compare-table td:first-child{
    color:var(--muted);
    text-align:left;
}

.better{
    color:var(--green)!important;
    font-weight:bold;
    text-shadow:0 0 10px #00ffae55;
}

.winner{
    margin-top:25px;
    padding:27px;
    border-radius:20px;
    text-align:center;
    border:1px solid var(--pink);
    background:
        radial-gradient(circle,#ff176b30,transparent 70%),
        #101521;
    box-shadow:0 0 40px #ff176b33;
}

.winner h3{
    color:var(--yellow);
    font-size:28px;
    text-shadow:0 0 15px #ffd84d66;
}

.winner p{
    margin-top:10px;
    color:var(--muted);
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#000d;
    backdrop-filter:blur(15px);
    z-index:3000;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:900px;
    max-height:92vh;
    overflow:auto;
    border-radius:25px;
    background:#0a0e17;
    border:1px solid var(--pink);
    box-shadow:
        0 0 35px #ff176b66,
        0 0 100px #ff176b22;
    position:relative;
}

.close{
    position:absolute;
    right:18px;
    top:18px;
    width:45px;
    height:45px;
    border-radius:50%;
    border:1px solid #ffffff33;
    background:#000b;
    color:#fff;
    cursor:pointer;
    font-size:20px;
    z-index:5;
}

.modal-image{
    width:100%;
    height:360px;
    object-fit:cover;
}

.modal-body{
    padding:28px;
}

.modal-body h2{
    font-size:38px;
    margin:8px 0 25px;
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.detail{
    padding:16px;
    background:#151a27;
    border:1px solid #ffffff08;
    border-radius:14px;
}

.detail span{
    display:block;
    color:var(--muted);
    font-size:13px;
    margin-bottom:7px;
}

.detail strong{
    font-size:16px;
}

/* ================= EMPTY ================= */

.empty{
    grid-column:1/-1;
    padding:70px 20px;
    text-align:center;
    color:var(--muted);
}

/* ================= FOOTER ================= */

footer{
    margin-top:90px;
    padding:45px 20px;
    text-align:center;
    color:#697286;
    border-top:1px solid #ff176b22;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .header{
        min-height:68px;
    }

    .logo{
        font-size:28px;
    }

    .container{
        width:94%;
    }

    .hero{
        padding:40px 5px 25px;
    }

    .hero p{
        font-size:15px;
    }

    .catalog{
        grid-template-columns:1fr;
    }

    .compare{
        padding:22px 14px;
    }

    .compare-selects{
        grid-template-columns:1fr;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .modal-image{
        height:240px;
    }

    .modal-body{
        padding:20px;
    }

    .modal-body h2{
        font-size:29px;
    }

}

</style>
</head>

/* =====================================================
   ЗМІННІ
===================================================== */

let currentCategory="all";
let favorites=[];


/* =====================================================
   SCORE
===================================================== */

function getScore(v){

    const power=Math.min(v.power/6.2,100);

    const speed=Math.min(v.speed/3.31,100);

    const weight=Math.max(
        0,
        100-(v.weight/20)
    );

    const price=Math.max(
        0,
        100-(v.price/2500)
    );

    return Math.round(
        power*.35+
        speed*.30+
        weight*.15+
        price*.20
    );
}


/* =====================================================
   ІКОНКА
===================================================== */

function getIcon(type){

    if(type==="Авто") return "🚗";

    if(type==="Мотоцикл") return "🏍️";

    if(type==="Пітбайк") return "🏁";

    if(type==="Скутер") return "🛵";

    return "🔥";
}


/* =====================================================
   КАТАЛОГ
===================================================== */

function renderCatalog(){

    const search=document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const list=vehicles.filter(v=>{

        const categoryOK=
            currentCategory==="all" ||
            v.type===currentCategory;

        const searchOK=
            v.name.toLowerCase().includes(search) ||
            v.brand.toLowerCase().includes(search) ||
            v.type.toLowerCase().includes(search);

        return categoryOK && searchOK;

    });

    document.getElementById("counter").textContent=
        `${list.length} моделей`;

    const catalog=document.getElementById("catalog");

    if(list.length===0){

        catalog.innerHTML=`
            <div class="empty">
                <h2>😕 Нічого не знайдено</h2>
                <br>
                <p>Спробуй іншу модель або категорію.</p>
            </div>
        `;

        return;
    }

    catalog.innerHTML=list.map(v=>`

        <article class="card">

            <div class="image-wrap">

                <img
                    src="${v.image}"
                    alt="${v.name}"
                    loading="lazy"
                >

                <div class="type-badge">
                    ${getIcon(v.type)} ${v.type}
                </div>

                <button
                    class="favorite ${favorites.includes(v.id)?"active":""}"
                    onclick="toggleFavorite(${v.id})">

                    ♥
                </button>

            </div>


            <div class="card-content">

                <div class="brand">
                    ${v.brand.toUpperCase()}
                </div>

                <h3>
                    ${v.name}
                </h3>


                <div class="specs">

                    <div class="spec">
                        <span>⚡ Потужність</span>
                        <strong>${v.power} к.с.</strong>
                    </div>

                    <div class="spec">
                        <span>🚀 Швидкість</span>
                        <strong>${v.speed} км/год</strong>
                    </div>

                    <div class="spec">
                        <span>🔧 Двигун</span>
                        <strong>${v.engine}</strong>
                    </div>

                    <div class="spec">
                        <span>🔩 Об'єм</span>
                        <strong>${v.volume}</strong>
                    </div>

                    <div class="spec">
                        <span>⚖️ Вага</span>
                        <strong>${v.weight} кг</strong>
                    </div>

                    <div class="spec">
                        <span>🏆 Score</span>
                        <strong>${getScore(v)}/100</strong>
                    </div>

                </div>


                <div class="card-footer">

                    <div class="price">
                        $${v.price.toLocaleString()}
                    </div>

                    <button
                        class="details-button"
                        onclick="openDetails(${v.id})">

                        Деталі →

                    </button>

                </div>

            </div>

        </article>

    `).join("");

}


/* =====================================================
   CATEGORY
===================================================== */

function setCategory(category,button){

    currentCategory=category;

    document
        .querySelectorAll(".category")
        .forEach(b=>{
            b.classList.remove("active");
        });

    button.classList.add("active");

    renderCatalog();

}


/* =====================================================
   FAVORITES
===================================================== */

function toggleFavorite(id){

    if(favorites.includes(id)){

        favorites=
            favorites.filter(x=>x!==id);

    }else{

        favorites.push(id);

    }

    renderCatalog();

}


/* =====================================================
   SELECTS
===================================================== */

function fillSelects(){

    const first=document.getElementById("vehicle1");

    const second=document.getElementById("vehicle2");

    first.innerHTML="";
    second.innerHTML="";

    vehicles.forEach(v=>{

        first.innerHTML+=`
            <option value="${v.id}">
                ${getIcon(v.type)}
                ${v.brand} ${v.name}
            </option>
        `;

        second.innerHTML+=`
            <option value="${v.id}">
                ${getIcon(v.type)}
                ${v.brand} ${v.name}
            </option>
        `;

    });

    first.value=1;

    second.value=6;

}


/* =====================================================
   COMPARE
===================================================== */

function compareVehicles(){

    const a=vehicles.find(
        v=>v.id==document.getElementById("vehicle1").value
    );

    const b=vehicles.find(
        v=>v.id==document.getElementById("vehicle2").value
    );

    if(!a || !b) return;


    const rows=[

        {
            name:"Потужність",
            a:a.power+" к.с.",
            b:b.power+" к.с.",
            winner:a.power>b.power?"a":
                   b.power>a.power?"b":"tie"
        },

        {
            name:"Максимальна швидкість",
            a:a.speed+" км/год",
            b:b.speed+" км/год",
            winner:a.speed>b.speed?"a":
                   b.speed>a.speed?"b":"tie"
        },

        {
            name:"Вага",
            a:a.weight+" кг",
            b:b.weight+" кг",
            winner:a.weight<b.weight?"a":
                   b.weight<a.weight?"b":"tie"
        },

        {
            name:"Ціна",
            a:"$"+a.price.toLocaleString(),
            b:"$"+b.price.toLocaleString(),
            winner:a.price<b.price?"a":
                   b.price<a.price?"b":"tie"
        },

        {
            name:"GidHot Score",
            a:getScore(a)+"/100",
            b:getScore(b)+"/100",
            winner:getScore(a)>getScore(b)?"a":
                   getScore(b)>getScore(a)?"b":"tie"
        }

    ];


    let aPoints=0;
    let bPoints=0;


    rows.forEach(row=>{

        if(row.winner==="a") aPoints++;

        if(row.winner==="b") bPoints++;

    });


    let winnerText="";


    if(aPoints>bPoints){

        winnerText=`
            <div class="winner">

                <h3>
                    🏆 ${a.name}
                </h3>

                <p>
                    Більше балів у цьому порівнянні:
                    ${aPoints} : ${bPoints}
                </p>

            </div>
        `;

    }

    else if(bPoints>aPoints){

        winnerText=`
            <div class="winner">

                <h3>
                    🏆 ${b.name}
                </h3>

                <p>
                    Більше балів у цьому порівнянні:
                    ${bPoints} : ${aPoints}
                </p>

            </div>
        `;

    }

    else{

        winnerText=`
            <div class="winner">

                <h3>
                    🤝 Нічия
                </h3>

                <p>
                    Однакова кількість балів.
                </p>

            </div>
        `;

    }


    document.getElementById("compareResult").innerHTML=`

        <table class="compare-table">

            <thead>

                <tr>

                    <th>Параметр</th>

                    <th>
                        ${a.name}
                    </th>

                    <th>
                        ${b.name}
                    </th>

                </tr>

            </thead>


            <tbody>

                ${rows.map(row=>`

                    <tr>

                        <td>
                            ${row.name}
                        </td>

                        <td class="${row.winner==="a"?"better":""}">

                            ${row.a}

                            ${row.winner==="a"?" 🏆":""}

                        </td>

                        <td class="${row.winner==="b"?"better":""}">

                            ${row.b}

                            ${row.winner==="b"?" 🏆":""}

                        </td>

                    </tr>

                `).join("")}


                <tr>

                    <td>
                        Двигун
                    </td>

                    <td>
                        ${a.engine}
                    </td>

                    <td>
                        ${b.engine}
                    </td>

                </tr>


                <tr>

                    <td>
                        Об'єм
                    </td>

                    <td>
                        ${a.volume}
                    </td>

                    <td>
                        ${b.volume}
                    </td>

                </tr>


                <tr>

                    <td>
                        Коробка
                    </td>

                    <td>
                        ${a.gearbox}
                    </td>

                    <td>
                        ${b.gearbox}
                    </td>

                </tr>


                <tr>

                    <td>
                        Привід
                    </td>

                    <td>
                        ${a.drive}
                    </td>

                    <td>
                        ${b.drive}
                    </td>

                </tr>


                <tr>

                    <td>
                        Розгін 0–100
                    </td>

                    <td>
                        ${a.acceleration}
                    </td>

                    <td>
                        ${b.acceleration}
                    </td>

                </tr>


                <tr>

                    <td>
                        Витрата
                    </td>

                    <td>
                        ${a.consumption}
                    </td>

                    <td>
                        ${b.consumption}
                    </td>

                </tr>

            </tbody>

        </table>

        ${winnerText}

    `;

}

        .getElementById("modal")
        .classList.remove("active");

.addEventListener("click",function(e){

    if(e.target===this){
        closeModal();

});
