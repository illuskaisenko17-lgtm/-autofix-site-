<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoMaster — Автомайстерня</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  overflow-x: hidden;
}

header {
  padding: 15px;
  background: linear-gradient(135deg,#222,#111);
  border-bottom: 2px solid #333;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.money {
  background: #1e8f45;
  padding: 9px 14px;
  border-radius: 12px;
  font-weight: bold;
}

.shop {
  min-height: 430px;
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(#333 0 65%, #202020 65% 100%);
}

.wall {
  height: 65%;
  background:
    repeating-linear-gradient(
      90deg,
      #333 0px,
      #333 80px,
      #292929 81px,
      #292929 160px
    );
  position: relative;
}

.sign {
  position: absolute;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  background: #e53935;
  padding: 12px 25px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 20px;
  box-shadow: 0 5px 20px #000;
}

.floor {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 35%;
  background:
    repeating-linear-gradient(
      0deg,
      #222 0px,
      #222 30px,
      #292929 31px,
      #292929 60px
    );
}

.lane {
  position: absolute;
  left: 5%;
  right: 5%;
  bottom: 35px;
  height: 130px;
  border: 3px dashed #777;
  border-radius: 15px;
}

.car {
  position: absolute;
  width: 210px;
  height: 85px;
  left: -230px;
  bottom: 60px;
  transition: left 3s linear;
}

.car-body {
  position: absolute;
  bottom: 18px;
  left: 10px;
  width: 190px;
  height: 55px;
  border-radius: 25px 35px 10px 10px;
  background: #d92727;
  box-shadow: inset 0 -10px 0 rgba(0,0,0,.2);
}

.car-top {
  position: absolute;
  bottom: 60px;
  left: 50px;
  width: 105px;
  height: 38px;
  background: #d92727;
  border-radius: 45px 45px 0 0;
}

.window {
  position: absolute;
  bottom: 64px;
  left: 63px;
  width: 80px;
  height: 25px;
  background: #8ed8ff;
  border-radius: 15px 15px 3px 3px;
}

.wheel {
  position: absolute;
  bottom: 0;
  width: 38px;
  height: 38px;
  background: #080808;
  border: 6px solid #555;
  border-radius: 50%;
}

.w1 { left: 32px; }
.w2 { right: 32px; }

.panel {
  padding: 15px;
  background: #151515;
}

.carName {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.condition {
  text-align: center;
  color: #aaa;
  margin: 6px;
}

.progress {
  height: 15px;
  background: #333;
  border-radius: 20px;
  overflow: hidden;
  margin: 12px 0;
}

.progressBar {
  height: 100%;
  width: 100%;
  background: #32c76b;
  transition: .3s;
}

.parts {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin-top: 15px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px 5px;
  color: white;
  font-weight: bold;
  background: #333;
  font-size: 14px;
}

button:active {
  transform: scale(.96);
}

.repair {
  background: #1976d2;
}

.upgrade {
  background: #8e44ad;
  width: 100%;
  margin-top: 12px;
}

.log {
  margin-top: 15px;
  background: #0c0c0c;
  border-radius: 12px;
  padding: 12px;
  min-height: 55px;
  color: #bbb;
}

.next {
  background: #e67e22;
  width: 100%;
  margin-top: 10px;
}

.hidden {
  display: none;
}

.level {
  text-align: center;
  margin-top: 8px;
  color: #ffd54f;
}
</style>
</head>

<body>

<header>
  <div class="logo">🔧 AutoMaster</div>
  <div class="money">💰 $<span id="money">500</span></div>
</header>

<div class="shop">

  <div class="wall">
    <div class="sign">AUTO SERVICE</div>
  </div>

  <div class="floor"></div>

  <div class="lane"></div>

  <div class="car" id="car">

    <div class="car-top"></div>
    <div class="window"></div>

    <div class="car-body"></div>

    <div class="wheel w1"></div>
    <div class="wheel w2"></div>

  </div>

</div>

<div class="panel">

  <div class="carName" id="carName">
    Очікуємо машину...
  </div>

  <div class="condition">
    Стан автомобіля:
    <b><span id="condition">100</span>%</b>
  </div>

  <div class="progress">
    <div class="progressBar" id="bar"></div>
  </div>

  <div class="parts">

    <button class="repair" onclick="repairPart('engine')">
      🔧 Двигун<br>
      $50
    </button>

    <button class="repair" onclick="repairPart('body')">
      🚗 Кузов<br>
      $40
    </button>

    <button class="repair" onclick="repairPart('wheel')">
      🛞 Колеса<br>
      $30
    </button>

  </div>

  <button class="next" onclick="newCar()">
    🚘 Наступна машина
  </button>

  <button class="upgrade" onclick="upgradeShop()">
    🏭 Прокачати майстерню
  </button>

  <div class="level">
    Рівень майстерні: <span id="level">1</span>
  </div>

  <div class="log" id="log">
    🚦 Очікуємо клієнта...
  </div>

</div>

<script>

let money = 500;
let condition = 100;
let level = 1;
let repairing = false;

const cars = [
  ["BMW M3", "🔴"],
  ["Toyota Supra", "🟠"],
  ["Audi RS6", "🔵"],
  ["Mercedes AMG", "⚫"],
  ["Nissan Skyline", "🟣"],
  ["Volkswagen Golf", "🟢"],
  ["Ford Mustang", "🔵"]
];

function updateUI() {

  document.getElementById("money").textContent = money;
  document.getElementById("condition").textContent = condition;
  document.getElementById("level").textContent = level;

  document.getElementById("bar").style.width =
    condition + "%";

  if(condition > 70) {
    document.getElementById("bar").style.background =
      "#32c76b";
  }
  else if(condition > 35) {
    document.getElementById("bar").style.background =
      "#f1c40f";
  }
  else {
    document.getElementById("bar").style.background =
      "#e74c3c";
  }
}

function log(text) {
  document.getElementById("log").textContent = text;
}

function newCar() {

  if(repairing) return;

  repairing = true;

  const car = document.getElementById("car");

  const random =
    cars[Math.floor(Math.random() * cars.length)];

  document.getElementById("carName").textContent =
    random[1] + " " + random[0];

  condition =
    Math.floor(Math.random() * 45) + 35;

  updateUI();

  car.style.left = "-230px";

  setTimeout(() => {

    car.style.left =
      "calc(50% - 105px)";

    log("🚗 Клієнт заїхав! Знайди, що треба ремонтувати.");

  },100);

}

function repairPart(part) {

  if(!repairing) {

    log("Спочатку дочекайся машини!");

    return;

  }

  let price = 0;
  let damage = 0;

  if(part === "engine") {
    price = 50;
    damage = 18;
  }

  if(part === "body") {
    price = 40;
    damage = 14;
  }

  if(part === "wheel") {
    price = 30;
    damage = 12;
  }

  if(money < price) {

    log("❌ Не вистачає грошей!");

    return;

  }

  money -= price;

  condition =
    Math.min(100, condition + damage);

  log("🔧 Ремонт виконано! -" + price + "$");

  if(condition >= 100) {

    const reward =
      100 + level * 25;

    money += reward;

    log(
      "✅ Машину повністю відремонтовано! " +
      "Ти отримав $" + reward
    );

    repairing = false;

  }

  updateUI();
}

function upgradeShop() {

  const price =
    level * 400;

  if(money < price) {

    log(
      "❌ Для прокачки потрібно $" +
      price
    );

    return;

  }

  money -= price;
  level++;

  log(
    "🏭 Майстерню прокачано до рівня " +
    level + "!"
  );

  updateUI();
}

updateUI();

setTimeout(newCar, 1000);

setInterval(() => {

  if(!repairing) {
    newCar();
  }

}, 12000);

</script>

</body>
</html>
